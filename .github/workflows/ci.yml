name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the examples are checked against whatever PyPI serves today —
    # including a dependency that moved under them.
    - cron: "0 7 * * 1"
  workflow_run:
    workflows: [publish]
    types: [completed]
  # On demand, because `workflow_run` checks out the tag's commit — which is by
  # construction *before* any example updated to depend on what that tag just
  # published. Run it by hand against `main` after such a change.
  workflow_dispatch:

# A second push to the same branch cancels the first: CI that reports on a
# commit nobody is looking at any more is CI that costs and says nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the workspace
        # --all-packages: the plugin under packages/ is part of the build, and
        # the layering gate reads what is in packages/ to know what to forbid.
        run: uv sync --all-packages --python ${{ matrix.python }}

      - name: Tests
        # Never `live`. It needs a key and it spends money, and CI has neither
        # a reason nor a budget to talk to a provider.
        run: uv run --python ${{ matrix.python }} pytest -q -m "not live"

      - name: Format
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Types
        run: uv run --python ${{ matrix.python }} pyright

  docs:
    name: The site still builds from these docs
    # The gap this closes cost three pushes after v0.3.0 was already on PyPI.
    #
    # digline.dev builds the site from two repositories: its own pages, and the
    # documentation here — docs/, CHANGELOG.md, ROADMAP.md, and one page per
    # examples/*/README.md. It builds with `mkdocs --strict`, so a relative link
    # that resolves on GitHub and not on the site, or an example with no entry
    # in the site's nav, is a failed build. That build runs in publish.yml
    # *after* PyPI, which is the one step that cannot be taken back — so the
    # first time anyone learns of a docs defect, the version is already spent.
    #
    # This is the same build, on every push, before any tag. It uses the site's
    # own config and its own sync script rather than a copy of either: a copy
    # would drift, and a gate that drifts is worse than none.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out digline/digline.dev
        uses: actions/checkout@v5
        with:
          repository: digline/digline.dev
          path: _site

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Shallow on purpose, unlike the real build. `sync-docs.sh` reads this
      # repository's history to date each page for the sitemap, detects a
      # shallow clone and falls back to mtimes rather than writing a date it
      # cannot stand behind. The dates are not what is under test here; the
      # links and the nav are.
      - name: Copy the product documentation in
        working-directory: _site
        run: tools/sync-docs.sh ..

      - name: Build the site, strict
        working-directory: _site
        run: uv run mkdocs build --strict

      - name: Check the sitemap
        working-directory: _site
        run: tools/check-sitemap.py site

  examples-from-pypi:
    name: The examples, against the published package
    runs-on: ubuntu-latest
    # After a release, not on every push. The monorepo tests already run every
    # example against the source on every build; this asks the other question —
    # whether a reader who has only what is on PyPI can run them. It is the
    # question the source tree cannot answer about itself.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        example:
          [
            classifier,
            prompt-first,
            rag,
            external-app,
            langchain4j,
            langchain,
            quickstart-toml,
          ]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Resolve from the index only
        working-directory: examples/${{ matrix.example }}
        # Retried: this job fires the moment `publish` finishes, and PyPI's
        # index takes a minute to serve what was just uploaded. A version that
        # is not there *yet* is not the same as one that is not there.
        run: |
          for attempt in 1 2 3 4 5 6; do
            uv sync && exit 0
            echo "index not ready yet, retrying in 20s"; sleep 20
          done
          echo "still unresolvable after two minutes"; exit 1

      # The one example whose application is a separate process. A suite that
      # is data cannot import a module, so it cannot start a server the way
      # `external-app/suite.py` does — the thing under test is somebody else's
      # process, which is what is true in production anyway.
      - name: Start the application under test
        if: matrix.example == 'quickstart-toml'
        working-directory: examples/quickstart-toml
        run: |
          uv run python stub.py &
          for attempt in $(seq 1 20); do
            curl -sf -o /dev/null --head http://127.0.0.1:8730/answer && exit 0
            sleep 0.5
          done
          echo "the stub never came up"; exit 1

      - name: The cycle a reader would run
        working-directory: examples/${{ matrix.example }}
        # Against the baseline committed in the example, never a fresh one:
        # promoting first would compare a run with itself and pass whatever
        # happened. `prompt-first` and `rag` are shipped red on purpose — their
        # READMEs are about that comparison — so for those two the expected
        # answer is exit 1, and green is the failure.
        run: |
          SUITE=suite.py
          [ -f suite.toml ] && SUITE=suite.toml
          KEY=$(uv run digline run --suite "$SUITE")
          set +e
          uv run digline compare --suite "$SUITE" --run "$KEY"
          status=$?
          set -e
          case "${{ matrix.example }}" in
            prompt-first|rag) want=1 ;;
            *)                want=0 ;;
          esac
          if [ "$status" -ne "$want" ]; then
            echo "expected exit $want from compare, got $status"
            exit 1
          fi

      - name: Its own gates
        working-directory: examples/${{ matrix.example }}
        run: |
          uv run ruff check .
          uv run pyright
