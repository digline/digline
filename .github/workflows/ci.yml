name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's own ref. Without it the required `gates` never start on
  # that ref and the queue waits on checks that were never going to report —
  # the shape of PR #82, where a branch push produced zero check runs. The
  # sign it has gone missing: a queue entry whose `gh-readonly-queue/main/...`
  # ref shows no `gates` at all, rather than red ones.
  merge_group:
  schedule:
    # Weekly, so the examples are checked against whatever PyPI serves today —
    # including a dependency that moved under them.
    - cron: "0 7 * * 1"
  workflow_run:
    workflows: [publish]
    types: [completed]
  # On demand, because `workflow_run` checks out the tag's commit — which is by
  # construction *before* any example updated to depend on what that tag just
  # published. Run it by hand against `main` after such a change.
  workflow_dispatch:
    inputs:
      image_pins_as_written:
        description: >-
          Build the image with docker/Dockerfile's pins exactly as written,
          even where CHANGELOG.md declares one of them unreleased. This is how
          to ask for the real build before the tag, and how to see the red the
          window suppresses on purpose.
        type: boolean
        default: false

# A second push to the same branch cancels the first: CI that reports on a
# commit nobody is looking at any more is CI that costs and says nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version `pyproject.toml` declares, and no fewer. 3.14 was a
        # classifier with no gate, and a defect that exists only there was
        # found by accident: its `exists()` answers False inside a directory
        # nobody can search, where 3.12 and 3.13 raise, so an unreadable
        # baseline read as no baseline (#365). A declared version nothing
        # runs is a claim nothing checks.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install the workspace
        # --all-packages: the plugin under packages/ is part of the build, and
        # the layering gate reads what is in packages/ to know what to forbid.
        #
        # --locked: refuse a lock that does not match `pyproject.toml` rather
        # than quietly fixing it. Without it `uv sync` **rewrites** `uv.lock` in
        # the runner and exits 0, so a lock left behind by a version bump is
        # reported as success — which is what happened on v0.15.1, whose tag
        # points at a lock still naming 0.15.0. RELEASING.md had already warned
        # in prose that such a lock "describes a release that does not exist",
        # while this command silently undid the warning: prose loses to a
        # command every time. Measured both ways on a drifted lock — exit 1 with
        # the flag, exit 0 and a rewritten lock without it.
        run: uv sync --all-packages --locked --python ${{ matrix.python }}

      - name: Tests
        # Never `live`. It needs a key and it spends money, and CI has neither
        # a reason nor a budget to talk to a provider.
        #
        # `-n 4`: the runner has four vCPUs, and this step was 91% of the job
        # — a median of 356s over 24 gate jobs on 2026-09-29, and three times
        # what it was three weeks earlier. Measured locally before it went in,
        # two collisions that a serial run cannot have, each caught once:
        #
        # - two tests that start `stub.py` on one fixed port, on two workers at
        #   once. `--dist loadgroup` puts them on one worker; the group and its
        #   reason are on `STANDALONE_PARAMS` in `tests/test_examples.py`.
        # - `tests/test_type_gate.py` writes a file into `src/digline/` and
        #   deletes it, and `tests/test_versions.py` listed it in between and
        #   then could not read it. That file runs in the next step, alone.
        #
        # The rule that came with it. `tests/test_await_index.py` (a two-second
        # deadline, polled every 0.4s) and `tests/test_view_limits.py` (a
        # half-second server timeout) wait on the clock, and this runner is
        # slower than the machine they were measured on. If either goes
        # intermittent here even once, they leave the parallel run the same
        # day: `--ignore` them in this step and run them serially in a step of
        # their own. Not a retry and not a longer timeout — a red that is not
        # true teaches everyone to ignore reds.
        run: uv run --python ${{ matrix.python }} pytest -q -m "not live" -n 4 --dist loadgroup --ignore=tests/test_type_gate.py

      - name: Tests that write into the source tree, serially
        # Its planted files are only safe when nothing else is reading `src/`.
        # Anything else that writes inside the checkout joins it here.
        run: uv run --python ${{ matrix.python }} pytest -q -m "not live" tests/test_type_gate.py

      - name: Format
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Types
        run: uv run --python ${{ matrix.python }} pyright

      - name: Home capture is current
        # docs/assets/home/home.json is what digline.dev's home shows, captured
        # by running digline. A version bump that did not regenerate it would
        # put another version's output on the site.
        run: uv run --python ${{ matrix.python }} python tools/home_capture.py --check

      - name: The example locks install as written
        # `uv sync --locked` in every `examples/*/uv.lock`, found by the glob,
        # into a throwaway environment, on this leg's Python. Until this step no
        # pull request read those locks: the tests above import the examples
        # against the source tree, and `examples-from-pypi` is skipped on
        # `pull_request`. So a dependabot lock bump was first installed by the
        # post-release check of the release it rode in.
        #
        # **What it does not prove, which is most of what an example is.** It
        # installs; it imports nothing and runs nothing, so it does not catch a
        # break between an example's code and the versions its lock pins. Those
        # are not the versions the tests above use: they run every example with
        # the root lock, and the two differ. Measured on 2026-09-28: `anthropic`
        # was 1.6.0 in `uv.lock` and 1.2.0 in `examples/prompt-first/uv.lock`
        # (1.3.0 in langchain, 1.4.0 in llamaindex). A bump that breaks an
        # import in an example is green here and green in the tests. Nor does
        # it compare a lock with the tree: `--locked` asks whether a lock
        # matches its own `pyproject.toml`, not whether it is current, and on
        # the same day every example lock named digline 0.21.1 while the tree
        # was 0.21.2. It does not reach the examples without a lock, which
        # resolve at install time, or the Java services, which
        # `java-example.yml` builds. And it proves Linux on 3.12, 3.13 and
        # 3.14, while the locks are universal. A green here means "installs as pinned,
        # here" and nothing about whether an example works: that question is
        # still `examples-from-pypi`'s.
        run: uv run --python ${{ matrix.python }} python tools/example_locks.py

  docs:
    name: The site still builds from these docs
    # The gap this closes cost three pushes after v0.3.0 was already on PyPI.
    #
    # digline.dev builds the site from two repositories: its own pages, and the
    # documentation here — docs/, CHANGELOG.md, ROADMAP.md, and one page per
    # examples/*/README.md. It builds with `mkdocs --strict`, so a relative link
    # that resolves on GitHub and not on the site, or an example with no entry
    # in the site's nav, is a failed build. That build runs in publish.yml
    # *after* PyPI, which is the one step that cannot be taken back — so the
    # first time anyone learns of a docs defect, the version is already spent.
    #
    # This is the same build, on every push, before any tag. It uses the site's
    # own config and its own sync script rather than a copy of either: a copy
    # would drift, and a gate that drifts is worse than none.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out digline/digline.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: digline/digline.dev
          path: _site
          # The site's whole history, unlike this repository's below. A
          # translated page records the commit of its original
          # (`source_commit`) and the build dates its notice from it, so a
          # shallow site checkout fails every build once translations exist.
          # digline.dev's own docs.yml and translate.yml fetch it whole for
          # the same reason.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Two builds, chosen by the event, because the site's sync refuses a
      # digline checkout that is ahead of origin/main (digline.dev 369db4e) —
      # and a pull request is checked out as its merge commit, which is always
      # one commit ahead. So is a merge-queue entry, `main` plus the pull
      # request, and it takes the pull request's build: the first entry
      # through the queue (#251) went red here on exactly that refusal.
      # Both builds are `mkdocs build --strict`.
      #
      # A pull request gets the site's own preview, `make preview`: the sync
      # skips the published-checkout check and leaves a marker the deploy gate
      # refuses, and `MKDOCS_OMITTED_FILES=info` lets a page with no nav entry
      # through — by the site's RUNBOOK a new page gets its nav line only once
      # it is on digline main, so on its own PR it has none. Nothing else is
      # loosened: a broken link, an anchor, a nav entry pointing at nothing, a
      # hook's PluginError all still fail it. The target is called rather than
      # copied, so the preview cannot drift from what the site means by one.
      #
      # Everything else — a push to main, the weekly schedule, the run after a
      # publish, a dispatch — gets the ordinary build, guard included. There
      # HEAD is origin/main (or a commit it already contains), so the guard
      # passes, and it is the build a release of the site will actually run:
      # a page on main with no nav line is a site that owes an entry, and that
      # should be red. A dispatch on a branch other than main is refused by the
      # guard, which is the guard being right.
      #
      # This repository shallow on purpose, unlike the real build. `sync-docs.sh` reads this
      # repository's history to date each page for the sitemap, detects a
      # shallow clone and falls back to mtimes rather than writing a date it
      # cannot stand behind. The dates are not what is under test here; the
      # links and the nav are.
      - name: Build the site from unreleased docs, strict (pull request)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: _site
        run: make preview DIGLINE=..

      - name: Copy the product documentation in
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        working-directory: _site
        run: tools/sync-docs.sh ..

      - name: Build the site, strict
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        working-directory: _site
        run: uv run mkdocs build --strict

      - name: Check the sitemap
        working-directory: _site
        run: tools/check-sitemap.py site

      # The three nav gates, in the one place they may not skip.
      #
      # `tests/_site.py` skips them wherever digline.dev is not on disk — the
      # `gates` job included, which clones no site — and a skip at the bottom of
      # 2400 passes is a silence, not a green: the nav line they exist for was
      # checked by nothing and the run said so in a number nobody reads. Here
      # the site is certainly present, because the step above just built with
      # it, so `DIGLINE_SITE_REQUIRED` makes a skip a failure.
      #
      # It is also the only place they run on a **pull request**: the preview
      # build sets `MKDOCS_OMITTED_FILES=info` and lets a page with no nav entry
      # through, by the site's own runbook, so without this a new page is never
      # red on the PR that adds it.
      #
      # By node id and not by file: this job syncs no workspace SDKs, and the
      # rest of `test_examples.py` needs them. `test_releasing.py` holds this
      # list to every test that reads the site config, so a fourth one cannot
      # be written without landing here.
      - name: The nav gates, where they may not skip
        env:
          DIGLINE_SITE_CONFIG: _site/mkdocs.yml
          DIGLINE_SITE_REQUIRED: "1"
        run: >
          uv run pytest -q
          tests/test_docs_pages.py::test_every_docs_page_is_in_the_site_nav
          tests/test_adr.py::test_every_adr_has_a_page_in_the_site_nav
          tests/test_examples.py::test_every_example_has_a_page_in_the_site_nav

      # The negative half, on this build rather than in a selftest. A gate that
      # cannot fail has verified nothing, and this one's entire value is that it
      # refuses to skip — so the same command, pointed at a config that is not
      # there, has to FAIL, and has to fail *for that reason*. Checking only the
      # exit code would pass on a syntax error in the test file.
      - name: And the control that must fail
        env:
          DIGLINE_SITE_CONFIG: _site/no-such-mkdocs.yml
          DIGLINE_SITE_REQUIRED: "1"
        run: |
          if uv run pytest -q \
            tests/test_docs_pages.py::test_every_docs_page_is_in_the_site_nav \
            > control.log 2>&1; then
            echo "::error::the nav gate passed with no site config to read:"
            echo "::error::DIGLINE_SITE_REQUIRED is not being honoured."
            cat control.log
            exit 1
          fi
          if ! grep -q "DIGLINE_SITE_REQUIRED is set, so this check may not skip" control.log
          then
            echo "::error::the control failed, but not for the reason under test:"
            cat control.log
            exit 1
          fi
          echo "control failed as required, and named the variable"

  glyphs:
    name: The site's fonts set every character of these docs
    # Twice on 2026-09-29, five hours apart, an ADR carried a character the
    # site's fonts do not set — `⁹` in ADR 0035, `⁻` in ADR 0036, both a
    # superscript in a power of ten. Every gate here was green both times, and
    # digline.dev's Build refused the page only after the merge, on the pull
    # request that adds the site's entries; each cost a second pull request
    # here to write the figure in words.
    #
    # The site serves IBM Plex as subsets, cut from the characters its pages
    # already use, so what is allowed is what today's subsets hold — not what
    # Plex can draw, and not a list anybody could keep here. So this is the
    # site's own check, `tools/check-glyphs.py`, called rather than copied, on
    # the preview the site builds from this checkout. The build and the check
    # are seconds each.
    #
    # **A job of its own, and never a step of `docs`.** `docs` is red by design
    # on every pull request that adds an ADR, until the site's nav line lands
    # after the merge. A glyph failure inside it would sit in that expected red
    # and look exactly like it — which is how both of the above went unseen.
    #
    # `make preview` on every event, not only on a pull request: the ordinary
    # build refuses a page with no nav line, which `main` carries between an
    # ADR and its site entry, and that red would be this job's too. A red in
    # the build step is therefore a broken build, which `docs` also reports,
    # and not a glyph finding; a glyph finding is a red in the last step.
    #
    # **What a green here does NOT cover:**
    #
    # 1. Text written in the site's own pull request — the nav title in
    #    `mkdocs.yml`, the descriptions in `seo.py` and `llms.py`. It does not
    #    exist until after the merge here, and only the site's Build sees it.
    # 2. Translated pages. A character a translation introduces is born on the
    #    site's side, from text that is not in this repository.
    # 3. A change on the site's side. If the site cuts its subsets again and
    #    drops a character `main` here already uses, this goes red on a pull
    #    request that did not cause it, or on the weekly run — it is not caught
    #    before the site's change lands.
    # 4. Which repair. A refusal says a subset lacks a character, not whether
    #    to write it in words here or to cut the subsets again there; both are
    #    valid when Plex has the glyph, and the second is the site's to make.
    #
    # Not a required check, and deliberately: `CLAUDE.md`, beside the three
    # `gates`, says why — item 3 above is a red this repository did not cause.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out digline/digline.dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: digline/digline.dev
          path: _site
          # Whole, for the reason the `docs` job gives: translated pages date
          # themselves from their original's commit.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Build the site's preview from these docs
        working-directory: _site
        run: make preview DIGLINE=..

      # The check reads the build, so a build that did not carry this
      # checkout's pages would pass having looked at nothing. Every page of
      # docs/ and docs/adr/ must be there — the two places both refusals came
      # from — or this step fails before the check can be green.
      - name: The build holds every page of this checkout
        run: |
          missing=0
          for f in docs/*.md docs/adr/*.md; do
            rel=${f#docs/}
            page="_site/site/product/${rel%.md}/index.html"
            if [ ! -f "$page" ]; then
              echo "::error::$f has no page in the build, at $page"
              missing=1
            fi
          done
          [ "$missing" = 0 ]
          echo "every page of docs/ and docs/adr/ is in the build"

      # --selftest first, on its own four-page site: a clean page of each kind
      # passes, a planted ✱ is refused in every face. A check that cannot fail
      # has verified nothing.
      - name: Every character in the site's fonts
        working-directory: _site
        run: |
          uv run tools/check-glyphs.py --selftest
          uv run tools/check-glyphs.py site

  image-touched:
    name: Does this change the image?
    # The docker job below is gated on this rather than on `on: paths:`, which
    # would apply to the whole workflow. A job skipped by `if:` still reports,
    # so a required check stays satisfiable; a workflow that never triggers
    # leaves it waiting forever.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs both ends. Ten megabytes of history, so the depth
          # costs less than deciding what depth would have been enough.
          fetch-depth: 0

      - id: check
        env:
          # A queue entry carries its base as `merge_group.base_sha`; without
          # it every entry would fall to "no base" below and build the image.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # No base to diff against — a scheduled run, a dispatch, the first
          # push to a branch. Build: the weekly one is there precisely to catch
          # a base image or a dependency moving under an unchanged Dockerfile.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base commit to compare against; building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          # What the image is made of, and nothing else. The Dockerfile
          # installs digline from PyPI rather than from this tree, so a change
          # under `src/` cannot change the image — it changes the *next* one,
          # which docker-publish.yml builds after the release.
          if echo "$changed" | grep -qE '^(docker/|\.github/workflows/(ci|docker-publish)\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing under docker/ changed; skipping the image build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: The image builds, and the quickstart runs inside it
    # Everything docker-publish.yml does before it pushes, and nothing it does
    # after: same context, same smoke script, no registry, no `packages:
    # write`. What it buys is the order — the image was found broken *after*
    # v0.5.0 was already on PyPI, because the only build was the one that
    # publishes.
    needs: image-touched
    if: needs.image-touched.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Decide which versions this build installs
        # Between the commit that bumps the version and the tag that releases
        # it, `docker/Dockerfile` pins versions PyPI does not serve yet —
        # `tests/test_docker.py` requires it to pin what the workspace
        # declares, so the two move together and the index cannot follow until
        # the release. Days of that is a red nobody can act on.
        #
        # So inside that window this builds the image against the last
        # published versions and says so in the summary, rather than skipping
        # the build: the window is exactly when `docker/` gets edited, and a
        # skipped build says nothing about an edited Dockerfile.
        #
        # The window is read from the CHANGELOG's `— unreleased` heading, not
        # from the index, so that a pin that is merely *wrong* still goes red.
        # `tools/image_pins.py` has the whole ruling.
        id: pins
        env:
          FORCE_REAL_PINS: ${{ inputs.image_pins_as_written }}
        run: |
          set -euo pipefail
          .github/docker_pins.sh docker/Dockerfile > /tmp/pins.txt
          python3 tools/image_pins.py --manifest /tmp/pins.txt --out /tmp/pins.txt

      - name: Wait for every pinned version to be served to this runner
        # This job is the most exposed consumer in the repository and had no
        # wait at all. It runs on `workflow_run: [publish] completed` — the
        # moment the release finishes — and builds a Dockerfile that installs
        # four exact versions from PyPI. That is how the digline-openai-v0.5.0
        # red happened: the build started ~20s after that publish completed and
        # was served `digline-anthropic` only up to 0.4.0.
        #
        # Four minutes, not thirty: nothing here waits on a human. By the time
        # this runs, `publish.yml` has finished and has already held the index
        # to the same files from its own runner. What is left is the edge skew
        # between that runner and this one, which is seconds to minutes.
        #
        # **On the release commit itself this red is expected and is not this
        # step's fault.** `docker/Dockerfile` is bumped in the commit the tag
        # points at, so the push-triggered `ci` runs before the `pypi` job has
        # uploaded anything. The failure message says which of the two cases it
        # is; the follow-on `ci` after `publish` is the run that counts. The
        # step above has already moved any pin the changelog declares
        # unreleased, so what reaches here is what this build will install.
        env:
          TIMEOUT: "240"
          INTERVAL: "15"
        run: python3 .github/await_index.py --manifest /tmp/pins.txt

      - name: Build for this runner's architecture, load, do not push
        # `load: true` and no `push:`. One architecture because this one has to
        # be *run*: a multi-arch build produces a manifest list and `--load`
        # cannot take one. arm64 is built once, at release, under emulation.
        #
        # No `cache-to`: a pull request writing the shared cache would let a
        # branch decide what the release build starts from. Reading it is free
        # and is most of the saving anyway.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          load: true
          tags: digline:smoke
          cache-from: type=gha
          # The wait from inside the build, where `pip` resolves. The runner-side
          # step above passed on 0.14.1 and the install still failed 20s later.
          #
          # The four versions come from the step that decided them, and are the
          # Dockerfile's own `ARG` defaults everywhere except inside the window
          # before a tag. Passing them always, rather than only when they
          # differ, keeps one source for what this build installs — and the
          # build log names it.
          build-args: |
            AWAIT_INDEX_TIMEOUT=240
            ${{ steps.pins.outputs.build_args }}

      - name: The front page's quickstart, on a mounted volume
        # The same script the release runs, against an image built the same
        # way. The version it installs is the released one — the Dockerfile
        # pins it — so this asks "does the image work", not "does the source
        # work"; the `gates` job above is what asks the second question.
        run: docker/smoke.sh digline:smoke

  examples-from-pypi:
    name: The examples, against the published package
    runs-on: ubuntu-latest
    # After a release, not on every push. The monorepo tests already run every
    # example against the source on every build; this asks the other question —
    # whether a reader who has only what is on PyPI can run them. It is the
    # question the source tree cannot answer about itself.
    # A queue entry is a pull request about to land, and asks what a pull
    # request asks.
    if: >-
      github.event_name != 'push' && github.event_name != 'pull_request' &&
      github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        example:
          [
            classifier,
            prompt-first,
            rag,
            external-app,
            langchain4j,
            langchain,
            langgraph,
            llamaindex,
            quickstart-toml,
            operator,
            mcp-tools,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Wait for this workspace's version to be served to this runner
        # This job fires the moment `publish` finishes, and PyPI takes a minute
        # to serve what was just uploaded — which is exactly what reddened the
        # `rag` and `llamaindex` legs on 0.8.0 while the other seven won the
        # same race by being scheduled seconds later.
        #
        # The bare retry that used to live in the step below could not tell a
        # version that is not there *yet* from one that is not there at all.
        # This asks the index for the exact version this workspace declares and
        # fails naming it.
        #
        # **What it does not cover, stated rather than assumed:** the examples
        # that carry a `uv.lock` — `ls examples/*/uv.lock`, which is what
        # `.github/release_followup.py` reads — pin an exact version, and after
        # a release those
        # locks legitimately still name the *previous* one until they are
        # regenerated. This waits for the version in `pyproject.toml` — the one
        # the post-release dispatch exists to prove — and says nothing about
        # what any individual lock resolves to.
        env:
          TIMEOUT: "240"
          INTERVAL: "15"
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          python3 .github/await_index.py "digline==$version"

      - name: Resolve from the index only
        working-directory: examples/${{ matrix.example }}
        # The wait above has already held the index to this workspace's
        # version. The two remaining tries are for the lock-pinned examples,
        # whose versions that wait cannot speak for.
        run: |
          for attempt in 1 2 3; do
            uv sync && exit 0
            echo "index not ready yet, retrying in 20s"; sleep 20
          done
          echo "still unresolvable after a minute"; exit 1

      # The one example whose application is a separate process. A suite that
      # is data cannot import a module, so it cannot start a server the way
      # `external-app/suite.py` does — the thing under test is somebody else's
      # process, which is what is true in production anyway.
      - name: Start the application under test
        if: matrix.example == 'quickstart-toml'
        working-directory: examples/quickstart-toml
        run: |
          # `python3`, not `uv run python`: stub.py is standard library only, and
          # a backgrounded `uv run` outlives this step holding uv's cache lock,
          # which deadlocks setup-uv's post-job `uv cache prune --ci` until it
          # times out and fails the leg green work and all. The stub is somebody
          # else's process; it does not want this project's environment.
          python3 stub.py &
          for attempt in $(seq 1 20); do
            curl -sf -o /dev/null --head http://127.0.0.1:8730/answer && exit 0
            sleep 0.5
          done
          echo "the stub never came up"; exit 1

      - name: The cycle a reader would run
        working-directory: examples/${{ matrix.example }}
        # Fixed decision 5, and the one place it could have been lost. Each
        # example's own `check.yml` is inert inside this monorepo — the workflow
        # that runs is this one — so the two pins `examples/langgraph` declares
        # there would not be applied by the leg that actually runs it. Harmless
        # for every example that never imports langchain, and set for all of
        # them rather than conditionally: an `if` on the matrix value would be a
        # second place to forget the next framework example.
        # All four, and the reason is the 0.12.1 delta-pass: the lookup takes
        # the first non-empty of these in this order, so pinning a subset leaves
        # the highest-precedence name free to turn it back on.
        env:
          LANGSMITH_TRACING_V2: "false"
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING: "false"
        # Against the baseline committed in the example, never a fresh one:
        # promoting first would compare a run with itself and pass whatever
        # happened. `rag` is shipped red on purpose — its README is about that
        # comparison — so for it the expected answer is exit 1, and green is the
        # failure. The same demonstration is held on every build by
        # `tests/test_examples.py`; this leg asks it of the published package.
        #
        # `prompt-first` runs and does not compare, and that is its README's
        # own rule: "The keyless path runs. It does not compare." Its committed
        # baseline is a live one, measured against the real model, and this
        # leg has no key, so a comparison here holds a stand-in against a real
        # model and measures nothing — on 0.20.1 it read "10 improved". What
        # the leg can prove for it without a key is the wiring: the suite
        # loads, every case is judged, a run is written. `run` exits non-zero
        # otherwise, and `set -e` holds that.
        run: |
          SUITE=suite.py
          [ -f suite.toml ] && SUITE=suite.toml
          KEY=$(uv run digline run --suite "$SUITE")
          if [ "${{ matrix.example }}" = "prompt-first" ]; then
            echo "prompt-first ran keyless as $KEY; its comparison is live-only"
            exit 0
          fi
          set +e
          uv run digline compare --suite "$SUITE" --run "$KEY"
          status=$?
          set -e
          case "${{ matrix.example }}" in
            rag) want=1 ;;
            *)                want=0 ;;
          esac
          if [ "$status" -ne "$want" ]; then
            echo "expected exit $want from compare, got $status"
            exit 1
          fi

      - name: Its own gates
        working-directory: examples/${{ matrix.example }}
        run: |
          uv run ruff check .
          uv run pyright
