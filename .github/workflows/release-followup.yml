# The five things a machine can ask once the tag is out — and one issue.
#
# `RELEASING.md`'s *After the tag* checklist had no gate of any kind, and it was
# skipped twice without anything noticing: the example locks were regenerated
# for 0.15.0 and were still naming it at 0.15.3, and the *Status* block was two
# releases behind on the same day. The caps admitted both versions and the stale
# prose was registered as history, so every run stayed green.
#
# **Why this is not a check on a pull request.** Between the tag and the
# follow-up commit the repository is *supposed* to be in the failing state: a
# lock cannot name a version the index has not served yet. A red on `main` for
# that window would be a second expected red, and the runbook has spent real
# effort making the one expected red distinguishable from a defect. So the
# finding goes somewhere that persists and is not a colour: an issue.
#
# **Reconciliation, not notification.** One open issue at a time, labelled
# `release-followup`. A failing run opens it or rewrites its body; a passing run
# closes it with a comment. That is the part that matters — the locks were stale
# for two releases precisely because nothing stayed open, and an email nobody
# answers is the same as no email. The job also exits non-zero, so the run is
# red for whoever is looking; the red is not the channel.
name: release-followup

on:
  # After a release, which is when the five become due.
  workflow_run:
    workflows: [publish]
    types: [completed]
  # And on every push to `main`, which is what closes the issue: the follow-up
  # work *is* a commit to `main`, so this is the moment to re-ask.
  push:
    branches: [main]
  # By hand, optionally about a *previous* release. The version is normally read
  # from `pyproject.toml`, which is the release just cut; naming an older tag
  # asks the same five questions about it, which is how you re-check a release
  # whose follow-up you are not sure of — and how this workflow's own channel
  # was exercised in both directions without committing anything untrue to
  # `main`.
  workflow_dispatch:
    inputs:
      version:
        description: "A released version to ask about, instead of the tree's"
        required: false
        type: string

concurrency:
  group: release-followup
  cancel-in-progress: false

permissions:
  contents: read
  # To open, rewrite and close the one issue. Nothing else is written.
  issues: write
  # To find and read back the approval an earlier run of this workflow kept,
  # which is the only reading left once `publish` has been re-run.
  actions: read

jobs:
  ask:
    name: Was the runbook followed after the tag?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The follow-up commits land on `main`, so `main` is the subject —
          # never the tag's commit, which by construction predates them.
          ref: main
          persist-credentials: false
          # `git tag --list` below decides whether a release has happened at
          # all, and a shallow clone carries no tags.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Before anything else: has this version been released? Between the
      # release PR merging and the tag being pushed, `pyproject.toml` names a
      # version that has no tag, no image and no publish run — and every check
      # below would fail for the honest reason that there is nothing to check.
      # That window is not a skipped step, so it opens no issue.
      - name: The version, and whether it is out
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(uv run --quiet python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          else
            echo "asked by hand about v$version, not about the tree's version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The newest released version, from the tags rather than from the
          # tree: between a bump and its tag, `pyproject.toml` names a version
          # that is not out yet, and it is the newest *released* one that
          # decides which questions still apply.
          newest="$(git tag --list 'v[0-9]*' | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "newest released: v$newest"
          if git tag --list "v$version" | grep -q .; then
            echo "released=yes" >> "$GITHUB_OUTPUT"
            echo "v$version is tagged; the follow-up is due"
          else
            echo "released=no" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version has no tag yet, so the release has not happened and there is nothing to follow up"
          fi

      # Step 1's evidence. Two calls, and the second is the negative half: the
      # approvals of *this* run, which has no gated environment and must
      # therefore record none. If it reads as approved, the query is not
      # reading approvals and the positive half proves nothing.
      #
      # And the attempt, because the endpoint answers for the latest one only: a
      # `publish` re-run — which RELEASING.md calls safe — leaves an attempt with
      # nothing to approve and makes attempt 1's approval unreadable (friction
      # 71, v0.21.0). So a run that reads an approval keeps it as an artifact of
      # its own, and a run on a re-run attempt reads the newest one back.
      - name: The approvals, and a run that cannot have one
        id: approvals
        if: steps.version.outputs.released == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # **Read more than once, and keep a third word.** Every read below is
          # of a listing GitHub answers eventually, and one read of it can come
          # back empty for a thing that exists. On 2026-09-29 the run list did,
          # once: the empty approvals that followed read as a gate that did not
          # hold, and #215 said so for nine minutes about a gate that had held.
          # The same shape met PyPI's JSON endpoint the same morning. So each
          # read is retried before its emptiness is believed, and a read that
          # never answers writes `"unread"`, which the script judges as *not
          # judged* rather than as *no*. (RELEASING.md, Status, v0.22.0)
          #
          # `listed` retries until the command prints something, and prints
          # nothing only if every attempt did. A failing command counts as an
          # empty one: it is the same absence.
          # Four reads, five seconds apart: long enough for a listing to catch
          # up, short enough that a re-run attempt, whose approvals are always
          # empty, costs a run fifteen seconds and not a minute.
          listed() {
            for try in 1 2 3 4; do
              out="$("$@" 2>/dev/null || true)"
              if [ -n "$out" ]; then printf '%s' "$out"; return 0; fi
              [ "$try" -lt 4 ] && sleep 5
            done
            return 0
          }
          run_id="$(listed gh run list --workflow=publish.yml --branch "v$VERSION" \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo '"unread"' > approvals.json
            echo "::warning::no publish run could be listed for v$VERSION after four reads: not judged"
          else
            # An empty list is a real answer here, and the one the v0.5.0 gate
            # failure gives, so it is believed — but only after it has been
            # asked for more than once. A call that fails is not a list at all.
            approvals="$(listed gh api "repos/${{ github.repository }}/actions/runs/$run_id/approvals" \
              --jq 'if length > 0 then . else empty end')"
            if [ -n "$approvals" ]; then
              printf '%s' "$approvals" > approvals.json
            elif gh api "repos/${{ github.repository }}/actions/runs/$run_id/approvals" \
              > approvals.json 2>/dev/null; then
              :
            else
              echo '"unread"' > approvals.json
              echo "::warning::the approvals of publish run $run_id did not answer: not judged"
            fi
            attempt="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" \
              --jq '.run_attempt' || echo 1)"
            if [ "${attempt:-1}" -ge 2 ]; then
              # Two absences kept apart: an artifact list that answered and holds
              # nothing is *none was kept*, the v0.21.0 case, which the script
              # says and an issue records; a list that never answered is
              # `"unread"`. `listed` retries the empty answer; the separate call
              # then tells the two apart by whether it answered at all.
              query="repos/${{ github.repository }}/actions/artifacts?name=followup-approvals-$run_id&per_page=100"
              pick='[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty'
              artifact="$(listed gh api "$query" --jq "$pick")"
              if [ -n "$artifact" ]; then
                gh api "repos/${{ github.repository }}/actions/artifacts/$artifact/zip" > kept.zip || true
                unzip -p kept.zip keep.json > kept.json || rm -f kept.json
                echo "attempt $attempt: read back the approval kept as artifact $artifact"
              elif gh api "$query" > /dev/null 2>&1; then
                echo "::warning::publish run $run_id is on attempt $attempt and no run kept its approval"
              else
                echo '"unread"' > kept.json
                echo "::warning::the kept approvals of publish run $run_id could not be listed: not judged"
              fi
            fi
          fi
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
            > no-gate.json || echo "[]" > no-gate.json
          echo "publish run: ${run_id:-none}, attempt ${attempt:-none}"
          echo "run=${run_id}" >> "$GITHUB_OUTPUT"
          echo "attempt=${attempt:-1}" >> "$GITHUB_OUTPUT"

      # Step 2's other half, the one a log cannot show. Four queries: the three
      # tags a release publishes, and one that cannot exist. `null` is
      # *not found*; the string `error` is *the registry did not answer*, and
      # the script refuses to judge the second rather than reporting a release
      # that shipped three different images.
      - name: The image tags, and one that cannot exist
        if: steps.version.outputs.released == 'yes'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull&service=ghcr.io" | uv run --quiet python -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          minor="${VERSION%.*}"
          : > digests.jsonl
          for tag in "$VERSION" "$minor" latest "$VERSION-does-not-exist"; do
            code_and_digest="$(curl -sS -o /dev/null -D - \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              -w '%{http_code}' \
              "https://ghcr.io/v2/${{ github.repository }}/manifests/$tag" 2>/dev/null \
              | tr -d '\r' || true)"
            digest="$(printf '%s' "$code_and_digest" | grep -i '^docker-content-digest:' | awk '{print $2}')"
            code="$(printf '%s' "$code_and_digest" | tail -c 3)"
            if [ -n "$digest" ]; then
              printf '%s\t%s\n' "$tag" "$digest" >> digests.jsonl
            elif [ "$code" = "404" ]; then
              printf '%s\t\n' "$tag" >> digests.jsonl
            else
              printf '%s\terror\n' "$tag" >> digests.jsonl
            fi
          done
          uv run --quiet python - <<'PY' > digests.json
          import json, pathlib
          out: dict[str, object] = {}
          for line in pathlib.Path("digests.jsonl").read_text().splitlines():
              tag, _, value = line.partition("\t")
              out[tag] = value or None
          print(json.dumps(out))
          PY
          cat digests.json

      # Step 7, in another repository: digline-action's `action.yml` on `main`,
      # on `v1` — what `uses: digline/digline-action@v1` actually downloads —
      # and on a ref that cannot exist. A 404 is *not found*; anything else
      # that is not a 200 is *did not answer*, and is not judged.
      - name: The action's default image, and a ref that cannot exist
        if: steps.version.outputs.released == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > action.jsonl
          for ref in main v1 v1-does-not-exist; do
            code="$(curl -sS -o "action-$ref.yml" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/digline/digline-action/contents/action.yml?ref=$ref" \
              2>/dev/null || true)"
            printf '%s\t%s\n' "$ref" "$code" >> action.jsonl
            echo "action.yml at $ref: HTTP $code"
          done
          uv run --quiet python - <<'PY' > action.json
          import json, pathlib
          out: dict[str, object] = {}
          for line in pathlib.Path("action.jsonl").read_text().splitlines():
              ref, _, code = line.partition("\t")
              if code == "200":
                  out[ref] = pathlib.Path(f"action-{ref}.yml").read_text(encoding="utf-8")
              else:
                  out[ref] = None if code == "404" else "error"
          print(json.dumps(out))
          PY

      - name: Ask the five, each with its control
        id: ask
        if: steps.version.outputs.released == 'yes'
        continue-on-error: true
        run: |
          # `pipefail`, and it is not a precaution: without it the exit status
          # of this pipeline is `tee`'s, which always succeeds. The first run
          # of this workflow found three steps of the runbook undone, opened
          # the issue that said so — and reported **success**, because the
          # script's `exit 1` died in the pipe. A check that cannot fail has
          # verified nothing, which is the sentence this file is built out of,
          # and it was true of the file itself.
          set -o pipefail
          uv run --quiet python .github/release_followup.py \
            --version "${{ steps.version.outputs.version }}" \
            --newest "${{ steps.version.outputs.newest }}" \
            --root . --releasing RELEASING.md \
            --approvals approvals.json --approvals-control no-gate.json \
            --publish-run "${{ steps.approvals.outputs.run }}" \
            --attempt "${{ steps.approvals.outputs.attempt }}" \
            --kept kept.json --read-by "${{ github.run_id }}" --keep-out keep.json \
            --digests digests.json --action action.json --out report.json | tee -a "$GITHUB_STEP_SUMMARY"

      # What this run read, kept where a re-run cannot erase it. Written by the
      # script only when it read an approval, so its absence is not a failure.
      - name: Keep the approval this run read
        if: steps.version.outputs.released == 'yes' && hashFiles('keep.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: followup-approvals-${{ steps.approvals.outputs.run }}
          path: keep.json
          retention-days: 90

      # The channel. One open issue **per release**, whose body is always the
      # current reading — rewritten rather than duplicated, and closed by the
      # run that finds that release's follow-up done.
      #
      # Per release, and not per repository, which is the correction this step
      # needed: the first cut kept one open issue for the whole repository, so
      # a green run about 0.15.3 closed an issue that named 0.15.2 — a step
      # nobody had done, marked done by a run that never looked at it. The
      # scope is the title prefix the script emits, so the two cannot spell it
      # differently. An issue about another release is left alone and said out
      # loud, because an older follow-up still outstanding is itself worth
      # seeing.
      - name: Open, rewrite or close this release's issue
        if: steps.version.outputs.released == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ok="$(uv run --quiet python -c 'import json; print(json.load(open("report.json"))["ok"])')"
          title="$(uv run --quiet python -c 'import json; print(json.load(open("report.json"))["title"])')"
          uv run --quiet python -c 'import json; open("body.md","w").write(json.load(open("report.json"))["body"])'
          gh label create release-followup --color B60205 \
            --description "A step of RELEASING.md after the tag is still undone" \
            --force > /dev/null 2>&1 || true
          scope="$(uv run --quiet python -c 'import json; print(json.load(open("report.json"))["scope"])')"
          # The open issues are a listing too, and the same two halves apply
          # to it as to the reads in the approvals step. A call that fails is
          # not an empty list: nothing is opened, rewritten or closed, and the
          # step goes red. An empty list is a real answer, usually the true
          # one, so it is believed at once, except in the one place an absence
          # makes this step *write*: before opening an issue, the list is asked
          # again, because an empty answer there opens a duplicate of the issue
          # it failed to show. (RELEASING.md, Status, v0.22.0)
          read_issues() {
            gh issue list --label release-followup --state open --limit 50 \
              --json number,title > open.json
          }
          find_mine() {
            uv run --quiet python - "$scope" <<'PY'
          import json, sys
          scope = sys.argv[1]
          for issue in json.load(open("open.json")):
              if issue["title"].startswith(scope):
                  print(issue["number"])
                  break
          PY
          }
          if ! read_issues; then
            echo "::error::the open release-followup issues could not be listed; nothing was opened, rewritten or closed"
            exit 1
          fi
          mine="$(find_mine)"
          others="$(uv run --quiet python - "$scope" <<'PY'
          import json, sys
          scope = sys.argv[1]
          print(
              ", ".join(
                  f"#{i['number']} ({i['title']})"
                  for i in json.load(open("open.json"))
                  if not i["title"].startswith(scope)
              )
          )
          PY
          )"
          undecided="$(uv run --quiet python -c 'import json; print(json.load(open("report.json"))["undecided"])')"
          if [ "$undecided" = "True" ]; then
            # Nothing was answered that was not already known: leave the issue
            # as it is. Opening, rewriting or closing it here would write down
            # a reading nobody made. The run still goes red below.
            echo "::warning::a check could not be read; this release's issue is left as it was"
            echo "Not judged: a check could not be read, so the issue was left as it was." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ok" = "True" ]; then
            if [ -n "$mine" ]; then
              gh issue comment "$mine" --body-file body.md
              gh issue close "$mine" \
                --comment "Every check above passes now; closed by release-followup.yml."
              echo "closed #$mine"
            else
              echo "nothing open for this release, nothing to close"
            fi
          elif [ -n "$mine" ]; then
            gh issue edit "$mine" --title "$title" --body-file body.md
            echo "rewrote #$mine"
          else
            for try in 1 2 3; do
              sleep 5
              if ! read_issues; then
                echo "::error::the open release-followup issues could not be listed a second time; no issue was opened"
                exit 1
              fi
              mine="$(find_mine)"
              [ -n "$mine" ] && break
            done
            if [ -n "$mine" ]; then
              gh issue edit "$mine" --title "$title" --body-file body.md
              echo "rewrote #$mine, which the first listing did not show"
            else
              gh issue create --label release-followup --title "$title" --body-file body.md
              echo "opened an issue, after four listings showed none for this release"
            fi
          fi
          # Said whichever way this run went: an open issue about another
          # release is a follow-up nobody finished, and a run that quietly
          # ignored it would be the silence this workflow exists to break.
          if [ -n "$others" ]; then
            echo "::notice::left open, because they name another release: $others"
            echo "Left open, naming another release: $others" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Last, so the issue exists before the run goes red: the red is for
      # whoever is watching, the issue is for whoever is not.
      - name: Fail if a step of the runbook is still undone
        if: steps.version.outputs.released == 'yes' && steps.ask.outcome != 'success'
        run: |
          echo "::error::a step of RELEASING.md after the tag is undone — see the issue labelled release-followup"
          exit 1
