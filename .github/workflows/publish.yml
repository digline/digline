name: publish

# One tag, one workspace. Everything in it whose version is not yet on the index
# gets published; everything already there is skipped, so re-tagging never tries
# to overwrite a released file — and a plugin release does not re-upload the core.
#
# Two tag shapes, and the difference is what the release is *about*:
#   v0.1.3                    a workspace release, led by the core
#   digline-bedrock-v0.1.0    one package, on its own version line
#   pytest-digline-v0.1.1     …and the package need not be named `digline-*`
# The second exists because version numbers are per package and collide: a
# plugin at 0.1.0 has no `v0.1.0` left to take. RELEASING.md has the whole
# procedure, including the one step that is not in this file.
#
# The named pattern is `<package>-v<version>`, and it used to be written
# `digline-*-v*`. That was right for as long as every package was called
# `digline-something`. `pytest-digline` inverts the prefix — that is the
# convention a pytest plugin is discovered by — so its first tag matched
# neither pattern and this workflow **never ran at all**. A release that
# silently does nothing is worse than one that fails: there is no red to look
# at, and the first sign is a package that never appears on the index. Nothing
# was spent and the tag was re-pushed once this was fixed.
#
# A stray tag that happens to match is not a hazard: the first job asserts that
# the name maps to a package at exactly that version, and fails loudly if not.
on:
  push:
    tags: ["v*", "*-v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check every package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Refuse a tag that names no package
        # A version on an index can never be reused, so a mistyped tag is the
        # one mistake here with no repair. It has to match something.
        run: |
          uv run --no-project --with tomli python - <<'PY'
          import glob, os, tomli
          ref = os.environ["GITHUB_REF_NAME"]
          found = {}
          for path in ["pyproject.toml", *glob.glob("packages/*/pyproject.toml")]:
              with open(path, "rb") as handle:
                  project = tomli.load(handle)["project"]
              found[project["name"]] = project["version"]
          print(f"tag {ref}; workspace: {found}")
          # "digline-bedrock-v0.1.0" -> ("digline-bedrock", "0.1.0");
          # "v0.1.3" -> ("", "", "v0.1.3"), so an empty name takes the else.
          name, _, version = ref.rpartition("-v")
          if name:
              # Stricter than the workspace form, and that is the point: a named
              # tag is checked against *that* package, not against whoever
              # happens to share the number.
              assert found.get(name) == version, f"{name} is not at {version}"
          else:
              version = ref.removeprefix("v")
              assert version in found.values(), f"no package is at {version}"
          PY

      - run: uv build --all-packages

      - name: Check the metadata renders on PyPI
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Every wheel installs on its own
        # A fresh venv per wheel: this is what a user gets, and the only place a
        # missing package or a broken entry point shows up.
        run: |
          for wheel in dist/*.whl; do
            rm -rf /tmp/fresh && python -m venv /tmp/fresh
            # `--find-links dist/` so a plugin's `digline>=0.1.3` resolves to
            # the core wheel built beside it: on the tag that releases them
            # together, that version is not on the index yet. The index stays
            # reachable for everything else, which is where `anthropic` and
            # `openai` come from.
            /tmp/fresh/bin/pip install --quiet --find-links dist/ "$wheel"
            echo "installed $wheel"
          done
          # Each plugin in its own fresh venv: the loop above leaves only the
          # last wheel installed, and "the last one imports" is not the check.
          for plugin in digline_anthropic digline_openai digline_bedrock; do
            rm -rf /tmp/plugin && python -m venv /tmp/plugin
            # Wheel filenames normalise the dash to an underscore, and the
            # core wheel goes in with it: `digline>=0.1.3` is not on the index
            # yet at this point in the tag, and must not be fetched from one.
            /tmp/plugin/bin/pip install --quiet \
              dist/"$plugin"-*.whl dist/digline-[0-9]*.whl
            /tmp/plugin/bin/python -c "import $plugin, digline.targets"
          done
          rm -rf /tmp/core && python -m venv /tmp/core
          /tmp/core/bin/pip install --quiet dist/digline-*.whl
          /tmp/core/bin/digline --help > /dev/null && echo "digline --help works"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  testpypi:
    name: TestPyPI, then install from it
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      # A job-level `permissions:` **replaces** the top-level block, it does not
      # add to it. `id-token: write` on its own therefore left `contents` at
      # none, and the checkout below went on working only because this
      # repository is public and git can read it unauthenticated. Both scopes
      # are written out, so nothing here rests on that staying true.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - id: select
        name: Keep only what the index does not have
        env:
          INDEX: https://test.pypi.org
        run: python .github/select_unpublished.py

      - if: steps.select.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: to-publish/
          skip-existing: true

      - name: Install from the index and run the quickstart
        run: |
          # The roster is `dist/`, not a list somebody has to remember to
          # edit. Unversioned here: TestPyPI resolves against a different set
          # of uploads, so a pin would fail for a reason that says nothing
          # about this release.
          python .github/dist_manifest.py /tmp/manifest
          python -m venv /tmp/from-index
          for attempt in 1 2 3 4 5; do
            /tmp/from-index/bin/pip install --quiet \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              -r /tmp/manifest/names.txt && break
            echo "index not ready yet, retrying in 15s"; sleep 15
          done
          /tmp/from-index/bin/digline --help > /dev/null
          .github/verify_imports.sh /tmp/from-index/bin/python /tmp/manifest
          tar -xzf dist/digline-*.tar.gz -C /tmp
          cd /tmp/digline-*/examples/quickstart
          /tmp/from-index/bin/digline run --suite suite.py
          /tmp/from-index/bin/digline promote --suite suite.py --run latest
          /tmp/from-index/bin/digline compare --suite suite.py --run latest

  pypi:
    name: PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    # Gated on a required reviewer: the one irreversible step in this file waits
    # for a person. A version number is spent the moment it is uploaded.
    environment: pypi
    permissions:
      # Both, for the reason spelled out on `testpypi` above.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - id: select
        name: Keep only what the index does not have
        env:
          INDEX: https://pypi.org
        run: python .github/select_unpublished.py

      - if: steps.select.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: to-publish/
          skip-existing: true

      - name: Install from the index and run the quickstart
        # The twin of the TestPyPI step above, and the only thing that proves
        # the **real** index serves what this tag uploaded. It was missing
        # until 0.7.1: every release before that verified TestPyPI and took
        # PyPI on trust, so the one index a user actually installs from was the
        # one nothing checked.
        #
        # Two differences from the twin, both paid for on 0.7.1:
        #
        # - **`--no-cache-dir`.** A warm pip cache answered "no matching
        #   distribution" for minutes after the upload, while PyPI's JSON API
        #   already served the version. The cache is per runner and usually
        #   cold, so this is cheap insurance against the day it is not.
        # - **Exact pins, read from `dist/`.** Without them a lagging index
        #   resolves the *previous* release and every command below succeeds —
        #   the step passes and has proved nothing. It is the same trap the
        #   examples job hit that morning, where six of eight legs installed
        #   0.7.0 and went green. `select_unpublished.py` copies rather than
        #   moves, so `dist/` is still whole here.
        run: |
          # Same roster as the TestPyPI step, and the same script refuses to
          # write one from an empty `dist/` — a check that can pass by finding
          # nothing is the vacuously green assertion decision 3 refuses.
          python .github/dist_manifest.py /tmp/manifest
          echo "the index must serve:"; cat /tmp/manifest/pins.txt
          python -m venv /tmp/from-index
          for attempt in $(seq 1 10); do
            # A requirements file rather than a word-split variable: the pins
            # are one per line, so nothing here depends on how the shell
            # splits, and `-r` is what pip documents for a list this shape.
            /tmp/from-index/bin/pip install --quiet --no-cache-dir -r /tmp/manifest/pins.txt && break
            if [ "$attempt" = 10 ]; then
              echo "::error title=PyPI does not serve what this tag uploaded::$(tr '\n' ' ' < /tmp/manifest/pins.txt)— still unresolvable after ten tries over two and a half minutes. The upload itself succeeded, so this does NOT need a re-tag: re-run this job. If it fails again the index and the upload disagree, and that is worth reading before the next release. See RELEASING.md, 'What CI proves about each index'."
              exit 1
            fi
            echo "index not ready yet, retrying in 15s"; sleep 15
          done
          /tmp/from-index/bin/digline --help > /dev/null
          .github/verify_imports.sh /tmp/from-index/bin/python /tmp/manifest
          tar -xzf dist/digline-*.tar.gz -C /tmp
          cd /tmp/digline-*/examples/quickstart
          /tmp/from-index/bin/digline run --suite suite.py
          /tmp/from-index/bin/digline promote --suite suite.py --run latest
          /tmp/from-index/bin/digline compare --suite suite.py --run latest

  site:
    name: Rebuild digline.dev
    needs: pypi
    # Nothing in this job uses `GITHUB_TOKEN`: there is no checkout, and the one
    # step authenticates to *another* repository with a PAT. An empty block is
    # the accurate grant, and it is worth writing on the one job in the file
    # that holds a credential which can write somewhere else.
    permissions: {}
    # Workspace releases only. The site describes what the core says — the
    # quickstart, the format, `docs/` — and a plugin release changes none of
    # it. When it does change (a page per provider, say), that arrives with a
    # push to the site's own repository, not with a tag here. It also keeps
    # `vX.Y.Z` the only shape the receiving script ever sees.
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      # The documentation on the site is this repository's docs/, copied in at
      # build time. Once the version is on PyPI, the site has to be rebuilt from
      # the tag that produced it, or it describes something you cannot install.
      #
      # DIGLINE_DEV_DISPATCH_TOKEN is a token with write access to
      # digline/digline.dev and nothing else — a fine-grained PAT scoped to that
      # one repository, Contents: read and write, which is what
      # repository_dispatch asks for. The workflow's own `github.token` cannot
      # do this: it is scoped to this repository, and the site is another one.
      #
      # The secret is read on the **step**, not the job, so nothing else in this
      # workflow is in reach of a token that can write to another repository.
      - name: Tell the site a version is out
        env:
          GH_TOKEN: ${{ secrets.DIGLINE_DEV_DISPATCH_TOKEN }}
        run: |
          # An unset secret expands to the empty string, and `gh` then fails
          # with `exit 4` and a generic sentence about GH_TOKEN — at the very
          # end of a release, after everything irreversible has happened. This
          # is the last step of the last job, so the diagnosis has to be in the
          # failure itself: nobody reads a workflow file at that point.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=DIGLINE_DEV_DISPATCH_TOKEN is not set::The site was not rebuilt. The packages are on PyPI and this does NOT need a re-tag. Add the repository secret DIGLINE_DEV_DISPATCH_TOKEN — a fine-grained PAT on digline/digline.dev only, Contents: read and write — at Settings > Secrets and variables > Actions, then re-run this job. See RELEASING.md, 'The one secret'."
            exit 1
          fi
          gh api repos/digline/digline.dev/dispatches --method POST \
            -f event_type=digline-release \
            -f 'client_payload[ref]'="$GITHUB_REF_NAME"
