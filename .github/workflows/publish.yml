name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Refuse a tag that does not match the version
        # The one mistake this catches is permanent: a version on PyPI can never
        # be reused, so `v0.1.0` publishing 0.2.0 is not a thing to fix later.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project --with tomli python -c \
            'import tomli;print(tomli.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$version"
          test "$tag" = "$version"

      - run: uv build

      - name: Check the metadata renders on PyPI
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: The wheel works on its own
        # In a venv with nothing else in it: this is what a user gets, and it is
        # the only place a missing package or a bad entry point shows up.
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/digline --help
          /tmp/fresh/bin/python -c "import digline.core, digline.targets, digline.cli"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI and install from it
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # trusted publishing; no token in a secret
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Install from TestPyPI into an empty venv
        # The rehearsal. Everything before this proves the artifact; this proves
        # the thing an index actually serves, which is not always the same.
        run: |
          python -m venv /tmp/from-index
          for attempt in 1 2 3 4 5; do
            /tmp/from-index/bin/pip install --quiet \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "digline==${GITHUB_REF_NAME#v}" && break
            echo "index not ready yet, retrying in 15s"; sleep 15
          done
          /tmp/from-index/bin/digline --help

      - name: Run the quickstart against the installed package
        # From the sdist, not the checkout: the example a reader copies has to
        # work from what was shipped, not from what happens to be on disk here.
        run: |
          /tmp/from-index/bin/pip download --no-deps --no-binary :all: \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "digline==${GITHUB_REF_NAME#v}" -d /tmp/sdist
          tar -xzf /tmp/sdist/digline-*.tar.gz -C /tmp
          cd /tmp/digline-${GITHUB_REF_NAME#v}/examples/quickstart
          /tmp/from-index/bin/digline run --suite suite.py
          /tmp/from-index/bin/digline promote --suite suite.py --run latest
          /tmp/from-index/bin/digline compare --suite suite.py --run latest

  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    # Gated on a required reviewer: the one irreversible step in this file waits
    # for a person. A version number is spent the moment it is uploaded.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
