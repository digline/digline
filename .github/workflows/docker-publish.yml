name: docker-publish

# The official image, `ghcr.io/digline/digline`, built on a workspace tag and
# pushed to GHCR — or by hand, for a rebuild:
#
#     gh workflow run docker-publish.yml --ref <branch>
#
# The image installs digline from PyPI, so it can only be built *after* the
# release has finished publishing. This workflow starts on the same tag push as
# `publish.yml` and therefore *races* it: the `pypi` job there sits behind a
# required reviewer, so the version can be minutes or hours away. Hence the wait
# below, which is what makes a tag trigger honest rather than a job that fails
# whenever a human is slow to approve.
#
# What the image contains is decided by the `ARG` lines in `docker/Dockerfile`
# and by nothing here: the version is read back out of that file, and the tags
# are derived from it. A version number written twice is a version number that
# will one day disagree with itself.
on:
  # A workspace release, the same tag shape `publish.yml` builds PyPI from.
  #
  # `v*` only, and not the `digline-*-v*` shape beside it there: the tags this
  # pushes are derived from `ARG DIGLINE_VERSION`, so a plugin-only release
  # would republish the *core's* `:X.Y.Z` onto a new digest — the one thing
  # docker/README.md promises that tag never does. A plugin that needs to reach
  # the image rides the next workspace release, or a `workflow_dispatch`.
  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build from. Empty means the ref this was dispatched on."
        required: false
        default: ""
      latest:
        # A rebuild of an older release must not become `latest`. It costs one
        # checkbox to keep that from being a thing you find out afterwards.
        description: "Also move :latest to this image"
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/digline/digline

jobs:
  smoke:
    name: The quickstart, inside the image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      revision: ${{ steps.plan.outputs.revision }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - id: plan
        name: Read the version out of the Dockerfile, derive the tags
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG DIGLINE_VERSION=//p' docker/Dockerfile)
          # An empty version would tag `:` and `:latest` and push something
          # nobody can name, so it stops here rather than there.
          if [ -z "$version" ]; then
            echo "docker/Dockerfile declares no ARG DIGLINE_VERSION"; exit 1
          fi
          revision=$(git rev-parse HEAD)
          echo "building $IMAGE $version from $revision"
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "tags<<TAGS"
            echo "$IMAGE:$version"
            # 1.2.3 -> 1.2, the tag that follows the newest patch
            echo "$IMAGE:${version%.*}"
            # Empty on a push, where there is no input to read: the tag a
            # release moves by default, refused only when somebody says so.
            if [ "${{ inputs.latest }}" != "false" ]; then echo "$IMAGE:latest"; fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for every pinned version to be served to this runner
        # `publish.yml` is triggered by the same tag push and its `pypi` job is
        # gated on a reviewer, so at this moment the index very probably does
        # not have the versions the Dockerfile pins yet. Building before it does
        # fails on `pip install digline==<version>` with nothing to retry.
        #
        # **All four pins, not just the core.** This step used to ask only
        # about `digline`, on the reasoning that an index serving one package
        # serves the rest. That is not true and cost a red: on
        # digline-openai-v0.5.0 the build was served `digline-anthropic` only
        # up to 0.4.0 while the core was already current. The pins come from
        # `docker/Dockerfile` through `docker_pins.sh`, so the list cannot fall
        # behind what the image actually installs.
        #
        # `await_index.py` asks the **simple index**, which is the file listing
        # `pip` itself resolves from — not `/pypi/<name>/<version>/json`. On the
        # first release that ran this step, that JSON endpoint answered 404 for
        # the three plugins for minutes after their upload had returned 200 and
        # after the simple index was already serving them.
        #
        # Thirty minutes because the wait here is for a person to press a
        # button, not for a CDN to catch up.
        env:
          TIMEOUT: "1800"
          INTERVAL: "30"
        run: |
          set -euo pipefail
          .github/docker_pins.sh docker/Dockerfile > /tmp/pins.txt
          python3 .github/await_index.py --manifest /tmp/pins.txt

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for this runner's architecture
        # One architecture, loaded into the local daemon, because that is what
        # can be *run*: a multi-arch build produces a manifest list, which
        # `--load` cannot take. The layers are cached, so the multi-arch build
        # in the next job pays for `arm64` and not for this again.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          load: true
          tags: digline:smoke
          # The same wait again, from inside the build: the edge `pip` reaches
          # there is not the one the step above polled (see docker/Dockerfile).
          # Five minutes, because the runner-side wait has already held back
          # for the person approving `pypi`.
          build-args: |
            VCS_REF=${{ steps.plan.outputs.revision }}
            AWAIT_INDEX_TIMEOUT=300
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The front page's quickstart, on a mounted volume
        # The one test that has to happen before the push, because it is the
        # only one that exercises what the image actually is: the entrypoint,
        # the working directory, and a repository arriving as a bind mount.
        #
        # The script, not a copy of it: `ci.yml` runs the same smoke against
        # the same image on every change to `docker/`, and two copies of it
        # would drift — with the drift landing in whichever one guards the
        # release.
        run: docker/smoke.sh digline:smoke

  publish:
    name: Build multi-arch and push to GHCR
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The repository's own token, with one permission added. No PAT: this
      # pushes to the package that belongs to this repository and to nothing
      # else, which is exactly what `packages: write` grants.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # arm64 is built under emulation. It is a CLI that shells out to nothing
      # at build time beyond apt and pip, so this is slow and not fragile.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.smoke.outputs.tags }}
          # arm64 installs here for the first time, from yet another network
          # namespace, so it waits from inside its build as well.
          build-args: |
            VCS_REF=${{ needs.smoke.outputs.revision }}
            AWAIT_INDEX_TIMEOUT=300
          cache-from: type=gha

      - name: Say what is now on the registry
        run: |
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.smoke.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
