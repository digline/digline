# The other half of pinning. A SHA pin is a promise that the build does not
# change under you; on its own it is also a promise that it never gets a fix.
# This is what keeps the pins fresh, so `Pinned-Dependencies` and
# `Dependency-Update-Tool` are two halves of one decision rather than two
# checkboxes.
#
# Everything is weekly and grouped: a bump that arrives as twelve pull requests
# on a Monday is a bump nobody reads. `ci.yml` runs on `pull_request`, so each
# of these arrives already gated by the same tests a human change is.
#
# What this file is not: it configures **version updates** only — pull requests
# on a schedule, advisory or no advisory. Dependabot **alerts** and **security
# updates** are repository settings, not entries here, and alerts can match only
# what the dependency graph has parsed. On 2026-09-29 the graph was off for this
# repository: the SBOM endpoint answered 404 where a public control repository
# answered 200, and the graph listed zero manifests. Alerts were switched on and
# had never raised one. So a Dependabot count of zero before that date is not
# evidence of anything, including the one cited when this file arrived.
# Nothing in this repository holds those settings; they can change without a
# commit.
version: 2
updates:
  # The workflows. Pinned by SHA with the tag in a comment beside it —
  # Dependabot rewrites both, which is the only reason that comment stays true.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"

  # The base image, pinned by digest in `docker/Dockerfile`. This is the entry
  # that turns that digest from a freeze into a pin: without it the image would
  # sit on whatever Debian shipped the day it was written.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    # Digest updates only. The first run of this file proposed
    # `python:3.12-slim` -> `python:3.14-slim`, which is not maintenance: the
    # interpreter inside the official image is a promise, named in
    # `docker/README.md` and held by `tests/test_docker.py`, and moving it is a
    # decision with a changelog entry rather than a Monday pull request. What
    # is wanted here is the *other* half — the same tag, rebuilt, when Debian
    # ships a fix — and that arrives as a digest change.
    ignore:
      - dependency-name: "python"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: "Bump"

  # The workspace lock. `uv`, not `pip`: what is committed here is `uv.lock`,
  # and the `pip` ecosystem cannot read one.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      workspace:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"

  # The examples that ship a lock. They are what a reader installs, so a stale
  # one is a stale instruction.
  #
  # Written by hand, while the other readers of those locks
  # (`tools/example_locks.py`, `.github/release_followup.py`) find them with
  # `examples/*/uv.lock`. A new lock has to be added here as well, and nothing
  # fails if it is not.
  #
  # This used to say every Python advisory against this repository had lived
  # here. That had no source: nothing recorded where each advisory sat. On
  # 2026-09-29 the one Python advisory OSV counts (GHSA-8mgp-746c-j5xp, nltk,
  # no fixed release) comes in through `llama-index-core`. It is in
  # `examples/llamaindex`'s lock *and* in the root lock's dev group, so "none in
  # digline" holds for the published wheels and not for this repository.
  - package-ecosystem: uv
    directories:
      - /examples/classifier
      - /examples/langchain
      - /examples/llamaindex
      - /examples/mcp-tools
      - /examples/prompt-first
      - /examples/quickstart-toml
      - /examples/rag
    schedule:
      interval: weekly
      day: monday
    groups:
      examples:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Bump"

  # The two Java services under `examples/langchain4j`. When this entry was
  # written (2026-09-11), sixty-three of the sixty-four advisories OpenSSF
  # counted against this repository were transitive Maven dependencies of these
  # two demos — nothing published to PyPI, and nothing in digline. The entry
  # moves what the poms *declare*. A fix in a transitive dependency arrives only
  # when a declared parent moves to it: three jackson-databind advisories were
  # published on 2026-09-28, hours after that week's bump had merged.
  #
  # And no alert will ever say so. The dependency graph reads these poms'
  # direct dependencies only — measured 2026-09-29: seven Maven packages, three
  # of them with no version, because the parent or the BOM manages it, and no
  # transitive at all. So a Maven advisory reaches this repository only through
  # Scorecard, which rewrites its one `Vulnerabilities` alert and never opens a
  # new one. That is a lasting gap, not a lag.
  - package-ecosystem: maven
    directories:
      - /examples/langchain4j/app-spring
      - /examples/langchain4j/app-quarkus
    schedule:
      interval: weekly
      day: monday
    groups:
      langchain4j-example:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Bump"

  # The SDKs the CI job `through-the-proxy` sends through `digline record
  # proxy` (ADR 0062 §5): Node's, and LangChain4j's in Java. Their own entries
  # and groups, so a bump arrives apart and the job says on that pull request
  # whether the proxy still records what the new version sends. Node's are
  # also the SDKs the Node recorder's hooks hook (ADR 0062 §4, as amended
  # 2026-11-06), and the job `recorder-node` says whether they still read them.
  - package-ecosystem: npm
    directories:
      - /recorders/node
    schedule:
      interval: weekly
      day: monday
    groups:
      through-the-proxy-node:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Bump"

  - package-ecosystem: maven
    directory: /recorders/java-proxy
    schedule:
      interval: weekly
      day: monday
    groups:
      through-the-proxy-java:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Bump"

  # The Java recorder's test project, `recorders/java` (ADR 0062 §4): the SDKs
  # its hooks hook, and JUnit. Its own entry and group, so a bump of what an
  # application hooks arrives apart from the example's, and the job
  # `recorder-java` says on that pull request whether the hooks still read
  # each SDK's calls.
  - package-ecosystem: maven
    directory: /recorders/java
    schedule:
      interval: weekly
      day: monday
    # OkHttp stays at the major openai-java brings: OkHttp 5's Maven artifact
    # carries none of the okhttp3 or okio classes DiglineOkHttp compiles
    # against, which #921 measured red. Lifted when openai-java moves to 5.
    ignore:
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types:
          - version-update:semver-major
    groups:
      java-recorder:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Bump"
