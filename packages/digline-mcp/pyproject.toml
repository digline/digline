[project]
name = "digline-mcp"
version = "0.2.0"
description = "MCP server for digline: an agent can read a result and measure one, and cannot promote a baseline."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Alessandro Prandini", email = "alessandro.prandini@ict-group.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # 0.11.0 is the release that first publishes `digline.host.prepare` and
    # `measure` — the composition both front ends now sit on, so journalling is
    # wired once rather than once per front end (ADR 0017 §11).
    #
    # Held by `tests/test_plugin_floors.py`, which computes the floor from the
    # newest *name* these sources import — and raised **by hand as well**,
    # because a name is only half of what a floor can owe. The other half is a
    # field: `RecordedResponse.tool_calls` arrived in digline 0.12.0, and a
    # names-based gate cannot see a widened field at all. That is the trap
    # `pytest-digline`'s own floor comment records, and the reason this number
    # is 0.11.0 rather than 0.12.0 is that nothing here reads that field — the
    # gate was checked rather than trusted, and this says so.
    #
    # 0.13.0, and by name this time: `explain` and `log` import `explained`,
    # `history`, `instant` and `log_json`, which first ship in digline 0.13.0
    # (ADR 0020 §8). Raised in the release after the one that built them, the
    # shape ADR 0017 §11 gave `prepare` and `measure`: a floor cannot name a
    # release that does not exist yet.
    # Raised to 0.15.1 for 0.1.4: `json_visible` is where the escape rule lives,
    # and against an older core this package would import a name that is not
    # there. An ImportError is the failure `test_plugin_floors.py` exists to
    # make impossible, and it found this one before the tag.
    "digline>=0.19.0",
    # Both halves matter. Unpinned, a resolver could hand somebody 1.x, where
    # `MCPServer` does not exist and `mcp.server.fastmcp` raises on import: the
    # 2.0 release renamed FastMCP, and every example written before it is wrong.
    # The cap is the same lesson the examples' caps gate encodes — a major
    # version that renames the entry point is not hypothetical here, it happened.
    "mcp>=2.2,<3",
]

# The same storefront as `digline` itself: a plugin's PyPI page is where
# somebody meets it first, so it points at the same site and the same repo
# rather than being a page of no links at all.
[project.urls]
Homepage = "https://digline.dev/"
Documentation = "https://digline.dev/product/guide/"
Changelog = "https://digline.dev/product/changelog/"
Repository = "https://github.com/digline/digline"
Issues = "https://github.com/digline/digline/issues"

[project.scripts]
digline-mcp = "digline_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digline_mcp"]

[tool.uv.sources]
digline = { workspace = true }
