[project]
name = "digline-anthropic"
version = "0.2.0"
description = "Anthropic target and judges for digline: prompt file in, priced Response out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Alessandro Prandini", email = "alessandro.prandini@ict-group.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to a version that exists. `digline` unpinned was fine while the
    # two were built together in one workspace; published, it would let a
    # resolver pick something older than the API this plugin is written
    # against — `JudgeBase` and its two subclasses are 0.1.3, and `config`,
    # the property that lets a run record what this plugin was set up to do,
    # is 0.2.0.
    "digline>=0.2.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digline_anthropic"]

[tool.uv.sources]
digline = { workspace = true }
