[project]
name = "digline-anthropic"
version = "0.8.0"
description = "Anthropic target and judges for digline: prompt file in, priced Response out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Alessandro Prandini", email = "alessandro.prandini@ict-group.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to a version that exists. `digline` unpinned was fine while the
    # two were built together in one workspace; published, it would let a
    # resolver pick something older than the API this plugin is written
    # against — `JudgeBase` and its two subclasses are 0.1.3, `config` is
    # 0.2.0, and `Provider`, which this plugin registers itself with, is
    # 0.5.0. `tests/test_plugin_floors.py` holds this number to the newest
    # core name the sources actually import.
    #
    # 0.13.0, held by name — `ToolCall`, the record the trajectory is handed
    # over in — and by hand, because a names gate cannot see the rest:
    # `Completion.tool_calls` is a *field*, and a `ToolStatus` of
    # `not_reported` a *value*; against 0.12.x the first raises TypeError and
    # the second is refused by the run document's reader. No `free()` here to
    # delegate: Anthropic hosts every model it serves. (ADR 0018 §1 and §9, the
    # `pytest-digline` precedent)
    #
    # 0.15.0, by hand for the same reason: `ToolCall(tool=None)` — a call the
    # provider did not name — is a *value*. Against 0.14.x it raises "must not
    # be empty" and errors the case, and the document it needs, which omits
    # `tool` and writes `tool_absence`, is schema 13. (ADR 0018 §1, amended
    # 2026-09-17)
    #
    # 0.35.0, by hand, because a names gate cannot see a keyword or a value:
    # `completion_of` hands over `Completion(unpriced=...)` and `_WhereServed`
    # overrides `Pricing.why_unpriced` (#569), and the plugin's half of #629
    # hands over `Completion(usage=None)`. All three are new in 0.35.0, which
    # is on PyPI. (ADR 0004 §8)
    #
    # And a cap, `<2`, from 2026-11-02. From 1.0.0 a minor does not break a
    # public Python signature, nor rename a name this plugin imports or a
    # method it calls: that waits for the next major (RELEASING.md, *Choosing
    # the version*). So the cap is the next major, and every 1.x installs under
    # it. Every package under `packages/` holds one, and
    # `tests/test_plugin_floors.py` reads it.
    #
    # **Owed at the cut: the floor raised to 1.1.0, from 2026-11-03.** The
    # recorder's map was published with 0.8.0, and is inert there: no released
    # core reads it. At 1.1 this package imports `StreamReading` from
    # `digline.recorder`, which no released core has, and a floor may not name
    # a release that does not exist yet. So it is released on its own tag
    # after digline 1.1.0's. RELEASING.md, *Owed at the cut*, holds the row.
    "digline>=0.35.0,<2",
    "anthropic>=0.40",
]

# The same storefront as `digline` itself: a plugin's PyPI page is where
# somebody meets it first, so it points at the same site and the same repo
# rather than being a page of no links at all.
[project.urls]
Homepage = "https://digline.dev/"
Documentation = "https://digline.dev/product/guide/"
Changelog = "https://digline.dev/product/changelog/"
Repository = "https://github.com/digline/digline"
Issues = "https://github.com/digline/digline/issues"

# How digline finds this plugin by name, without importing it: fixed decision 6,
# and ADR 0007 §3 is what finally needed it. The group name is part of the
# plugin contract — see `digline.targets.registry`.
[project.entry-points."digline.providers"]
anthropic = "digline_anthropic:PROVIDER"

# How digline's recorder finds the map for this provider's client, without
# importing it: the name says which client class and which of its methods is
# the call, and the value is loaded only when a call is recorded (ADR 0058 §6).
[project.entry-points."digline.recording_maps"]
"anthropic.Anthropic:messages.create" = "digline_anthropic.recording:MAP"
"anthropic.Anthropic:messages.stream" = "digline_anthropic.recording:STREAM_MAP"
"anthropic.AsyncAnthropic:messages.create" = "digline_anthropic.recording:MAP"
"anthropic.AsyncAnthropic:messages.stream" = "digline_anthropic.recording:STREAM_MAP"

# How `digline record proxy` reads this provider's calls off the wire: one
# entry per route, named as `--upstream ROUTE=URL` names it, loaded when the
# proxy starts (ADR 0062 §3).
[project.entry-points."digline.recording_wire"]
anthropic = "digline_anthropic.recording:WIRE"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digline_anthropic"]

[tool.uv.sources]
digline = { workspace = true }
