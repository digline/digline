[project]
name = "digline-anthropic"
version = "0.3.0"
description = "Anthropic target and judges for digline: prompt file in, priced Response out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Alessandro Prandini", email = "alessandro.prandini@ict-group.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to a version that exists. `digline` unpinned was fine while the
    # two were built together in one workspace; published, it would let a
    # resolver pick something older than the API this plugin is written
    # against — `JudgeBase` and its two subclasses are 0.1.3, `config` is
    # 0.2.0, and `Provider`, which this plugin registers itself with, is
    # 0.5.0. `tests/test_plugin_floors.py` holds this number to the newest
    # core name the sources actually import.
    "digline>=0.5.0",
    "anthropic>=0.40",
]

# How digline finds this plugin by name, without importing it: fixed decision 6,
# and ADR 0007 §3 is what finally needed it. The group name is part of the
# plugin contract — see `digline.targets.registry`.
[project.entry-points."digline.providers"]
anthropic = "digline_anthropic:PROVIDER"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digline_anthropic"]

[tool.uv.sources]
digline = { workspace = true }
