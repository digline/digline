[project]
name = "digline-anthropic"
version = "0.5.3"
description = "Anthropic target and judges for digline: prompt file in, priced Response out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Alessandro Prandini", email = "alessandro.prandini@ict-group.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to a version that exists. `digline` unpinned was fine while the
    # two were built together in one workspace; published, it would let a
    # resolver pick something older than the API this plugin is written
    # against — `JudgeBase` and its two subclasses are 0.1.3, `config` is
    # 0.2.0, and `Provider`, which this plugin registers itself with, is
    # 0.5.0. `tests/test_plugin_floors.py` holds this number to the newest
    # core name the sources actually import.
    #
    # 0.13.0, held by name — `ToolCall`, the record the trajectory is handed
    # over in — and by hand, because a names gate cannot see the rest:
    # `Completion.tool_calls` is a *field*, and a `ToolStatus` of
    # `not_reported` a *value*; against 0.12.x the first raises TypeError and
    # the second is refused by the run document's reader. No `free()` here to
    # delegate: Anthropic hosts every model it serves. (ADR 0018 §1 and §9, the
    # `pytest-digline` precedent)
    #
    # 0.15.0, by hand for the same reason: `ToolCall(tool=None)` — a call the
    # provider did not name — is a *value*. Against 0.14.x it raises "must not
    # be empty" and errors the case, and the document it needs, which omits
    # `tool` and writes `tool_absence`, is schema 13. (ADR 0018 §1, amended
    # 2026-09-17)
    "digline>=0.17.0",
    "anthropic>=0.40",
]

# The same storefront as `digline` itself: a plugin's PyPI page is where
# somebody meets it first, so it points at the same site and the same repo
# rather than being a page of no links at all.
[project.urls]
Homepage = "https://digline.dev/"
Documentation = "https://digline.dev/product/guide/"
Changelog = "https://digline.dev/product/changelog/"
Repository = "https://github.com/digline/digline"
Issues = "https://github.com/digline/digline/issues"

# How digline finds this plugin by name, without importing it: fixed decision 6,
# and ADR 0007 §3 is what finally needed it. The group name is part of the
# plugin contract — see `digline.targets.registry`.
[project.entry-points."digline.providers"]
anthropic = "digline_anthropic:PROVIDER"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digline_anthropic"]

[tool.uv.sources]
digline = { workspace = true }
