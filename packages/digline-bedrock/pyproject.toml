[project]
name = "digline-bedrock"
version = "0.8.0"
description = "Amazon Bedrock target and judges for digline, on the Converse API."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Alessandro Prandini", email = "alessandro.prandini@ict-group.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Pinned to a version that exists, like the other two plugins: published,
    # an unpinned `digline` would let a resolver pick something older than the
    # API this plugin is written against — `JudgeBase` and its two subclasses
    # are 0.1.3, and `config`, the property that lets a run record what this
    # plugin was set up to do, is 0.2.0.
    #
    # 0.13.0, and held there twice. By name: `ToolCall`, the record the
    # trajectory is handed over in, and `free`, which this package's `free()`
    # now delegates to so the zero is a declared price (ADR 0022 §2) — both
    # dated in `tests/test_plugin_floors.py`. And by hand, because a names gate
    # cannot see the other half: `Completion.tool_calls` is a *field*, and a
    # `ToolStatus` of `not_reported` a *value*, and against 0.12.x the first
    # raises TypeError and the second is refused by the run document's reader.
    # (ADR 0018 §1 and §9, the `pytest-digline` precedent)
    #
    # 0.15.0, by hand for the same reason: `ToolCall(tool=None)` — a call the
    # provider did not name — is a *value*. Against 0.14.x it raises "must not
    # be empty" and errors the case, and the document it needs, which omits
    # `tool` and writes `tool_absence`, is schema 13. (ADR 0018 §1, amended
    # 2026-09-17)
    #
    # 0.35.0, by hand for the same reason: `completion_of` hands over
    # `Completion(unpriced=...)` (#569), and the plugin's half of #629 hands
    # over `Completion(usage=None)`. Both are new in 0.35.0, which is on PyPI.
    # (ADR 0004 §8)
    #
    # And a cap, `<2`, from 2026-11-02. From 1.0.0 a minor does not break a
    # public Python signature, nor rename a name this plugin imports or a
    # method it calls: that waits for the next major (RELEASING.md, *Choosing
    # the version*). So the cap is the next major, and every 1.x installs under
    # it. Every package under `packages/` holds one, and
    # `tests/test_plugin_floors.py` reads it.
    #
    # 1.1.1, by name: this package imports `StreamReading` from
    # `digline.recorder`, which 1.1.1 is the first release on PyPI to carry
    # (v1.1.0 is tagged and never reached PyPI). Its recording maps are first
    # published here, and from 1.1.1 a core reads them.
    "digline>=1.1.1,<2",
    # digline-anthropic, for InvokeModel's Anthropic Messages body: read with
    # the map a direct Messages call is read with, so there is one reading of
    # Messages and not two that drift (P-1543; ADR 0062 §2, noted 2026-11-05).
    # A dependency and not an extra, because an extra adds a state to explain:
    # a call counted for want of a package.
    #
    # 0.9, by name: `WIRE` and the stream reading this package imports first
    # ship in digline-anthropic 0.9.0. Capped at the next minor, `<0.10`, as
    # the examples that depend on it cap it.
    "digline-anthropic>=0.9,<0.10",
    # boto3 and nothing else. No wrapper, no gateway: the Converse API is one
    # call, and a layer on top would only add a second thing to be wrong.
    "boto3>=1.35",
]

# The same storefront as `digline` itself: a plugin's PyPI page is where
# somebody meets it first, so it points at the same site and the same repo
# rather than being a page of no links at all.
[project.urls]
Homepage = "https://digline.dev/"
Documentation = "https://digline.dev/product/guide/"
Changelog = "https://digline.dev/product/changelog/"
Repository = "https://github.com/digline/digline"
Issues = "https://github.com/digline/digline/issues"

# How digline finds this plugin by name, without importing it: fixed decision 6,
# and ADR 0007 §3 is what finally needed it. The group name is part of the
# plugin contract — see `digline.targets.registry`.
[project.entry-points."digline.providers"]
bedrock = "digline_bedrock:PROVIDER"

# How digline's recorder finds the map for this provider's client, without
# importing it: the name says which client class and which of its methods is
# the call, and the value is loaded only when a call is recorded (ADR 0058 §6).
[project.entry-points."digline.recording_maps"]
"botocore.BedrockRuntime:converse" = "digline_bedrock.recording:MAP"
"botocore.BedrockRuntime:converse_stream" = "digline_bedrock.recording:STREAM_MAP"
"botocore.BedrockRuntime:invoke_model" = "digline_bedrock.recording:INVOKE_MAP"
"botocore.BedrockRuntime:invoke_model_with_response_stream" = "digline_bedrock.recording:INVOKE_STREAM_MAP"

# How `digline record proxy` reads this provider's calls off the wire: one
# entry per route, named as `--upstream ROUTE=URL` names it, loaded when the
# proxy starts (ADR 0062 §3). One route for both calls: the path says which.
[project.entry-points."digline.recording_wire"]
bedrock = "digline_bedrock.recording:WIRE"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digline_bedrock"]

[tool.uv.sources]
digline = { workspace = true }
digline-anthropic = { workspace = true }
