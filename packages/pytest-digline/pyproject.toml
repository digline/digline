[project]
name = "pytest-digline"
version = "0.2.2"
description = "Gate a pytest run on a digline comparison: one row per check, against the baseline committed in your repo."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Alessandro Prandini", email = "alessandro.prandini@ict-group.it" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # 0.9.0 is the release that first publishes `report.check_line`, the
    # per-delta sentence this package prints on a failing row (ADR 0013 §6).
    # Held there by `tests/test_plugin_floors.py`, which computes the floor
    # from the newest name these sources import rather than taking it on trust.
    # 0.10.0 and not 0.9.0: the plugin reads `AssertionDelta.canary`, which is
    # a *field* rather than an imported name — so `test_plugin_floors.py`, which
    # tracks names, cannot see the dependency and this floor is the only thing
    # that holds it. Against 0.9.0 the row rule would raise AttributeError on
    # the first comparison. (ADR 0016 §8)
    #
    # 0.10.1 raises it again, and this time the gate can see why: the package
    # imports `report.visible`, which arrived there. A judge's `reason` quotes
    # what a model answered and this plugin prints it into a terminal, so the
    # escaping is not optional here.
    #
    # 0.14.0 raises it a third time, for a name the gate sees and a field it
    # does not: the plugin imports `report.scale_lost` and `calibration_fact`,
    # and reads `AssertionDelta.calibration` so a calibration case that moved
    # inside its band never fails a row. A calibration case outside its band is
    # the plugin's ERROR state, with the report's sentence. (ADR 0024 §4.7)
    #
    # 0.20.0, a fourth time, for a name the gate sees: the plugin catches
    # `digline.host.REFUSALS`, which arrived there, and turns every refusal into
    # pytest's usage error rather than an INTERNALERROR.
    #
    # **Owed at the cut: raise to the core release that carries #452.** The
    # plugin catches what the CLI's `main()` catches (#475), and refuses a
    # `SystemExit` from code digline runs through `refused_exit`, which the
    # gate dates to 0.28.0, passing `front_end=`, which it cannot see and which
    # first ships with #452 (ADR 0043 §2, amended). A floor may not name a
    # release that does not exist yet, so the row is in RELEASING.md's table of
    # floors owed to the release, and this package takes a release of its own
    # after the core's.
    "digline>=0.20.0",
    # A floor and no cap, unlike `digline-mcp`'s `mcp<3`. That cap records a
    # rename that actually happened; pytest has not moved the `pytest11` entry
    # point in a decade, and a cap here would fight the one dependency the user
    # certainly already has. 8.0 is where `@pytest.hookimpl(wrapper=True)` — the
    # hook that keeps an ERROR row free of a traceback — became available.
    "pytest>=8.0",
]

# The same storefront as `digline` itself: a plugin's PyPI page is where
# somebody meets it first, so it points at the same site and the same repo
# rather than being a page of no links at all.
[project.urls]
Homepage = "https://digline.dev/"
Documentation = "https://digline.dev/product/pytest/"
Changelog = "https://digline.dev/product/changelog/"
Repository = "https://github.com/digline/digline"
Issues = "https://github.com/digline/digline/issues"

# Named `digline` and not `pytest_digline`: this is the name a user types to
# switch it off — `pytest -p no:digline` — and it is what the header prints.
[project.entry-points.pytest11]
digline = "pytest_digline.plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_digline"]

[tool.uv.sources]
digline = { workspace = true }
