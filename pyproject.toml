[project]
name = "digline"
version = "0.20.0"
description = "Regression testing for LLM output, against a baseline committed in your own repo."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alessandro Prandini", email = "hello@digline.dev" },
]
keywords = ["llm", "evaluation", "eval", "assertions", "baseline", "regression", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # The core's only runtime dependency. See docs/adr/0001: an incomplete
    # in-house validator would be a vacuously green assertion.
    "jsonschema>=4.21",
]

# Every one of these has to resolve for somebody who is not us: a PyPI page of
# 404s is worse than a PyPI page with three links. The frictions log lives in a
# separate private repository, so it is not here.
[project.urls]
Homepage = "https://digline.dev/"
Documentation = "https://digline.dev/product/guide/"
Changelog = "https://digline.dev/product/changelog/"
Repository = "https://github.com/digline/digline"
Issues = "https://github.com/digline/digline/issues"

[project.scripts]
digline = "digline.cli.main:main"

# A dependency group, not an extra: `uv sync` installs it by default, so a
# fresh clone can run the gates without anyone having to know a flag.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    # For `tools/home_capture.py`, which evaluates the markers on digline's own
    # requirements. Already in the lock through pytest; named here so a tool
    # does not lean on another tool's dependency.
    "packaging>=24",
    # Not a dependency of digline and never will be: it is here so that
    # `tests/test_examples.py` can run `examples/langchain` against this source
    # on every build, the same way it runs every other example. The example
    # declares its own floor; this one only has to be able to import it.
    "langchain>=1.3.18,<2",
    # Same reason, for `examples/llamaindex`. The core only — the example
    # depends on the core only, and the meta-package would put an OpenAI
    # binding in this environment that nothing here calls.
    "llama-index-core>=0.14.24,<0.15",
    # Same reason again, for `examples/langgraph`. It brings `langchain` with
    # it — `create_agent` moved there in v1 — and the pin above is satisfied by
    # the version it wants, so the two examples share one resolution.
    "langgraph>=1.2.11,<2",
]

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digline"]

[tool.hatch.build.targets.wheel.force-include]
"src/digline/py.typed" = "digline/py.typed"

# The sdist carries what makes the wheel reproducible and reviewable: the
# sources, the tests that gate them, the ADRs the decisions live in.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CLAUDE.md",
    "/LICENSE",
]
exclude = [
    "/docs/screenshots/*.png",
    "/docs/screenshots/**/*.png",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/digline-anthropic/tests",
    "packages/digline-openai/tests",
    "packages/digline-bedrock/tests",
    "packages/digline-mcp/tests",
    "packages/pytest-digline/tests",
]
markers = [
    # Costs money and needs a key. Skipped unless the provider's key is set and
    # DIGLINE_LIVE=1, so the default run is offline and free.
    "live: calls a real provider",
]
# `.` so `tests` is importable as a package (`tests._helpers`) whatever the
# working directory; `src` so the sources are importable without an install;
# `tools` for the fence reader the docs tests share with the home capture.
pythonpath = [
    ".",
    "src",
    "tools",
    "packages/digline-anthropic/src",
    "packages/digline-openai/src",
    "packages/digline-bedrock/src",
    "packages/digline-mcp/src",
    "packages/pytest-digline/src",
]

[tool.ruff]
line-length = 88
src = [
    "src",
    "tests",
    "tools",
    "examples/quickstart",
    "packages/digline-anthropic/src",
    "packages/digline-openai/src",
    "packages/digline-bedrock/src",
    "packages/digline-mcp/src",
    "packages/pytest-digline/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
# Not `examples/*`: each example under there is a standalone project with
# its own pyproject, its own venv and its own strict pyright run. Checking
# them from here would collide four modules called `app` and resolve none
# of them. The quickstart is not standalone and stays.
include = ["src", "tests", "tools", "examples/quickstart", "packages"]
extraPaths = [
    # `src` itself, and it was missing until 0.15.1 — every plugin's `src` was
    # listed and the core's own was not. An editable install leaves nothing in
    # `site-packages/digline/` but `py.typed`; the code is reachable only through
    # a `.pth`, which pyright does not read. So pyright resolved `digline` well
    # enough for names that already existed and reported every **newly added**
    # one as an unknown import symbol — a strict gate that was blind in exactly
    # the case you need it, and silent about being blind.
    "src",
    "tools",
    "examples/quickstart",
    "packages/digline-anthropic/src",
    "packages/digline-openai/src",
    "packages/digline-bedrock/src",
    # The plugins' tests share their fakes through a `_fakes` module imported
    # by name, which pytest makes importable and pyright has to be told about.
    "packages/digline-openai/tests",
    "packages/digline-bedrock/tests",
    "packages/digline-mcp/src",
    "packages/pytest-digline/src",
    # `tools/image_pins.py` imports `.github/await_index.py` — the one reader of
    # the index in this repository — the way CI runs it, by path and at call
    # time. Listed here so that import resolves and its types are read. Not in
    # `include`: those scripts run under the runner's bare `python3`, and what
    # holds them is `tests/test_await_index.py` driving them end to end.
    ".github",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
