[project]
name = "digline"
version = "0.5.0"
description = "Regression testing for LLM output, against a baseline committed in your own repo."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alessandro Prandini", email = "hello@digline.dev" },
]
keywords = ["llm", "evaluation", "eval", "assertions", "baseline", "regression", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # The core's only runtime dependency. See docs/adr/0001: an incomplete
    # in-house validator would be a vacuously green assertion.
    "jsonschema>=4.21",
]

# Every one of these has to resolve for somebody who is not us: a PyPI page of
# 404s is worse than a PyPI page with three links. `digline.dev` is not live and
# the frictions log lives in a separate private repository, so neither is here.
[project.urls]
Documentation = "https://github.com/digline/digline/blob/main/docs/api.md"
Repository = "https://github.com/digline/digline"
Issues = "https://github.com/digline/digline/issues"

[project.scripts]
digline = "digline.cli.main:main"

# A dependency group, not an extra: `uv sync` installs it by default, so a
# fresh clone can run the gates without anyone having to know a flag.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    # Not a dependency of digline and never will be: it is here so that
    # `tests/test_examples.py` can run `examples/langchain` against this source
    # on every build, the same way it runs every other example. The example
    # declares its own floor; this one only has to be able to import it.
    "langchain>=1.3.18,<2",
]

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digline"]

[tool.hatch.build.targets.wheel.force-include]
"src/digline/py.typed" = "digline/py.typed"

# The sdist carries what makes the wheel reproducible and reviewable: the
# sources, the tests that gate them, the ADRs the decisions live in.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CLAUDE.md",
    "/LICENSE",
]
exclude = [
    "/docs/screenshots/*.png",
    "/docs/screenshots/**/*.png",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/digline-anthropic/tests",
    "packages/digline-openai/tests",
    "packages/digline-bedrock/tests",
]
markers = [
    # Costs money and needs a key. Skipped unless the provider's key is set and
    # DIGLINE_LIVE=1, so the default run is offline and free.
    "live: calls a real provider",
]
# `.` so `tests` is importable as a package (`tests._helpers`) whatever the
# working directory; `src` so the sources are importable without an install.
pythonpath = [
    ".",
    "src",
    "packages/digline-anthropic/src",
    "packages/digline-openai/src",
    "packages/digline-bedrock/src",
]

[tool.ruff]
line-length = 88
src = [
    "src",
    "tests",
    "examples/quickstart",
    "packages/digline-anthropic/src",
    "packages/digline-openai/src",
    "packages/digline-bedrock/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
# Not `examples/*`: each example under there is a standalone project with
# its own pyproject, its own venv and its own strict pyright run. Checking
# them from here would collide four modules called `app` and resolve none
# of them. The quickstart is not standalone and stays.
include = ["src", "tests", "examples/quickstart", "packages"]
extraPaths = [
    "examples/quickstart",
    "packages/digline-anthropic/src",
    "packages/digline-openai/src",
    "packages/digline-bedrock/src",
    # The plugins' tests share their fakes through a `_fakes` module imported
    # by name, which pytest makes importable and pyright has to be told about.
    "packages/digline-openai/tests",
    "packages/digline-bedrock/tests",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
