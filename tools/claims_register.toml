# The absolute claims this repository makes about where data goes, each with
# the code that makes it true. Read by tools/claims.py, checked by
# tests/test_claims.py.
#
# An entry is admitted when the claim is anchored — `anchor.path` holds
# `anchor.contains`, and that text is why the sentence is true — not because
# the sentence is harmless. Both ends are checked on every run: a `quote` no
# longer in its `file`, or an anchor that no longer holds its evidence, fails.
#
# `quote` is compared the way the gate reads text: lowercased, whitespace
# collapsed, Markdown's `*` dropped. Write it as the sentence reads.

[[claim]]
file = "packages/digline-openai/src/digline_openai/target.py"
quote = "the call goes only to the endpoint `base_url` names"
anchor = { path = "packages/digline-openai/src/digline_openai/client.py", contains = 'kwargs["base_url"] = base_url' }
why = "The client is built on the base_url the target was given, and on nothing else."
since = "#48"

[[claim]]
file = "examples/llamaindex/README.md"
quote = "the only network calls are the ones your suite makes: the synthesizer's and the judge's, to Anthropic"
anchor = { path = "examples/llamaindex/suite.py", contains = 'LIVE = os.environ.get("DIGLINE_LIVE") == "1"' }
why = "Off the default path, the synthesizer and the judge call Anthropic behind this switch; on it, nothing calls out."
since = "#48"

[[claim]]
file = "examples/llamaindex/README.md"
quote = "Baselines, runs and reports stay in your repository."
anchor = { path = "src/digline/store/file_store.py", contains = "self.root = Path(project_root).resolve() / STORE_DIRNAME" }
why = "The file store writes under .digline/ in the project root it is given."
since = "#48"

