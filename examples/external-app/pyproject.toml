[project]
name = "ticket-api-eval"
version = "0.1.0"
description = "Evaluating an application digline cannot import, over HTTP."
requires-python = ">=3.12"
dependencies = [
    # The published package, nothing local. This directory is meant to become
    # its own repository: `cp -r` it anywhere and `uv sync` has to work.
    # `HttpTarget` arrives in 0.1.2 (friction 14) and the committed baseline is
    # schema 8, so anything older refuses it. The pin is not that minimum: the
    # release ritual moves every example onto the release, so it is the current
    # one, and the caps gate in tests/test_examples.py holds it there.
    "digline>=0.6,<0.7",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
# An application, not a library: there is nothing here to build a wheel from.
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.12"
