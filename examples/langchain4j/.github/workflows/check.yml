name: check

# Inert while this lives inside the digline monorepo — the workflow that runs is
# the one at the repository root. It is here so that the day this directory
# becomes its own repository, the cycle is already wired.
on:
  push:
  schedule:
    # Monday, 06:00 UTC. The model on the other end is updated by a provider on
    # a schedule you do not control. The run nobody triggered notices.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  app:
    name: The Java service still builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # `verify`, not `run`: compiling costs nothing and calls no model. The
      # service is only *started* where there is a key to start it with, which
      # is the deployed instance the eval below points at — never here.
      - run: mvn -B -f app/pom.xml verify

  eval:
    name: The suite, against the committed baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      # From PyPI, like any user: this checks the published package, not a
      # checkout of it.
      - run: uv sync

      # In your repository, set SUPPORT_URL to a deployed instance of your
      # service and put the provider key on *that* side. Unset, the suite runs
      # against `stub.py`, which is deterministic and free — which is what makes
      # this example runnable by somebody who has neither.
      #
      # The gate. `run` writes a run and prints its key; `compare` holds it
      # against the baseline committed in this repository and exits non-zero if
      # anything got worse. There is deliberately no `promote` here: promoting
      # is the human decision that *this* is the new normal, made by someone
      # reading the report and committing the result. A job that promotes before
      # it compares compares a run with itself and passes by construction.
      - name: Compare with the committed baseline
        run: |
          KEY=$(uv run digline run --suite suite.py)
          uv run digline compare --suite suite.py --run "$KEY"

      - run: uv run ruff check .
      - run: uv run pyright
