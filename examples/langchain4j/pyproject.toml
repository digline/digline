[project]
name = "northwind-support-eval"
version = "0.1.0"
description = "Evaluating a LangChain4j service with digline, over HTTP."
requires-python = ">=3.12"
dependencies = [
    # The published package, nothing local. This directory is meant to become
    # its own repository: `cp -r` it anywhere and `uv sync` has to work.
    # `config_path` arrives in 0.3.0 (ADR 0005 §8). The pin is not that minimum
    # but the current release, which the ritual raises and the caps gate holds.
    "digline>=0.6,<0.7",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
# An application, not a library: there is nothing here to build a wheel from.
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
# `.` and not the default: without an explicit include pyright walks the
# virtualenv and type-checks site-packages, which is 778 errors about
# somebody else's code.
include = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.12"
