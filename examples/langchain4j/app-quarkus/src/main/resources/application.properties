quarkus.http.port=8080

# The model this service answers with. These three values are what the
# /evaluate endpoint reports back as "config", so digline can name the change
# the day one of them moves. Same three as app-spring, spelled the way the
# Quarkus extension spells them.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.0
quarkus.langchain4j.openai.chat-model.max-tokens=512

# Read back by SupportService so the answer can report what it was set up as.
# One source, two readers: the extension configures the model from these, and
# the endpoint declares them.
support.model=${quarkus.langchain4j.openai.chat-model.model-name}
support.temperature=${quarkus.langchain4j.openai.chat-model.temperature}
support.max-tokens=${quarkus.langchain4j.openai.chat-model.max-tokens}
