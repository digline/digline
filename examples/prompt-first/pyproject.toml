[project]
name = "bookshop-replies-eval"
version = "0.1.0"
description = "Writing a prompt with no application yet, with digline."
requires-python = ">=3.12"
dependencies = [
    # 0.1.2: a score landing exactly on its threshold inside `Repeated`
    # used to produce `error` instead of `pass`, and this judge returns
    # exactly 0.7.
    "digline>=0.3,<0.4",
    "digline-anthropic>=0.2,<0.3",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.12"
