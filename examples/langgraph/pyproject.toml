[project]
name = "northwind-dispatch-eval"
version = "0.1.0"
description = "Putting a LangGraph agent under digline's gate, in process."
requires-python = ">=3.12"
dependencies = [
    # The published package, nothing local. This directory is meant to become
    # its own repository: `cp -r` it anywhere and `uv sync` has to work.
    "digline>=0.12,<0.14",
    # A floor, not a pin: 1.2.11 is the version this was written and tested
    # against, and the ceiling is the major. The weekly run in `check.yml` is
    # what tells you a minor moved under the agent — which is the whole question
    # this example exists to answer, so pinning it exactly would be pinning the
    # thing under test.
    "langgraph>=1.2.11,<2",
    # `create_agent` lives here, not in langgraph, since the v1 move. The
    # deprecated `langgraph.prebuilt.create_react_agent` still imports and still
    # runs; it is removed in v2, and an example written from memory is born
    # deprecated.
    "langchain>=1.4.0,<2",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
# An application, not a library: there is nothing here to build a wheel from.
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.12"
