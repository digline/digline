[project]
name = "northwind-support-eval"
version = "0.1.0"
description = "Gating a support endpoint with digline, in TOML — no Python in the suite."
requires-python = ">=3.12"
dependencies = [
    # The published package, nothing local. This directory is meant to become
    # its own repository: `cp -r` it anywhere and `uv sync` has to work.
    # 0.5.0 is where the declarative suite arrives (ADR 0007).
    # The floor names the oldest digline that reads the baseline committed
    # here: schema 22, so 0.35.0. When the baselines move to another schema,
    # the floor moves with them. No gate checks it yet, and this sentence is
    # that gate's specification (RELEASING.md, step 5). The cap is the next
    # major: from 1.0.0 a minor breaks no public Python signature.
    "digline>=0.35.0,<2",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
# An application, not a library: there is nothing here to build a wheel from.
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
# `.` and not the default: without an explicit include pyright walks the
# virtualenv and type-checks site-packages, which is 778 errors about
# somebody else's code.
include = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.12"
