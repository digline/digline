[project]
name = "library-rag-eval"
version = "0.1.0"
description = "Checking that a RAG answer stays inside what was retrieved."
requires-python = ">=3.12"
dependencies = [
    # The published package, nothing local. This directory is meant to become
    # its own repository: `cp -r` it anywhere and `uv sync` has to work.
    # 0.1.2 is where every judged assertion sends one prompt shape and
    # exports the label to split on (friction 32).
    "digline>=0.1.2,<0.2",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
# An application, not a library: there is nothing here to build a wheel from.
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.12"
