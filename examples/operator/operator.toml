# The operator's configuration. It reads this; it never decides it.
#
# Everything an agent could otherwise talk itself into is a number in this
# file, written down before anything runs. That is the whole discipline: a
# stopping rule chosen after the fact measures your patience rather than the
# system.

[operator]
suite = "suite.py"

# What the schedule says, repeated here so this file is readable on its own.
# GitHub reads the real cadence from `.github/workflows/operator.yml`, not from
# here — so `loop.py` refuses to start when the two disagree rather than let
# this line quietly become decoration.
#
# Weekly, because this is a demonstration. A real one is as often as you can
# afford: every run costs what the suite costs.
cadence = "0 6 * * 1"

[stopping_rule]
# AGENTS.md §3. Two is usually enough to tell a wobble from a drift. Decided
# here, before the first run, because with a stochastic judge enough re-runs
# always produce a green one.
max_reruns = 2

# AGENTS.md §4. At or above this many cases regressing together in one run, the
# event is investigated and **never** retried: retrying destroys the evidence
# either way — the regression gets a green run to hide behind, and a judge that
# has moved is never measured.
structural_flip_cases = 2

[budget]
# The ceiling on calls to the target for one cycle, worst case. `loop.py`
# multiplies the suite's planned calls by `1 + max_reruns` and refuses to start
# if the answer is above this — before spending anything, which is the only
# moment a budget means something.
#
# digline itself enforces nothing here: `acknowledge_calls` is per call. This
# is the loop applying the same discipline to the whole cycle.
max_target_calls = 12

[escalation]
destination = "github-issue"

# The default, and deliberately. The three-layer document is written on every
# cycle whatever this says; `false` is what also opens an issue. A loop that
# escalated the day you forked it would teach you to ignore it by the third
# week.
dry_run = true

labels = ["digline", "operator"]

[judgment]
# Layer 3, the only one a model writes. Off unless the key is configured — the
# same opt-in every example in this repository uses. When it is off the alert
# still carries the heading and says the layer was not run: an absence is
# stated, never faked.
enabled_when = "DIGLINE_LIVE=1"
model = "claude-haiku-4-5"

# --------------------------------------------------------------------------- #
# The policy: when a classified cycle is allowed not to wake anybody.
#
# The loop classifies — draw, drift, structural, system error — and that does
# not move: it is deterministic, reproducible and tested. What the policy
# decides is the question the classification cannot answer on its own, which is
# whether this particular drift, this week, is worth a person's evening.
#
# It may only **narrow**. A clause holds; no clause wakes. A new reason to wake
# somebody is a new classification, in loop.py, where a test can hold it — and
# three floors no clause may ever lower: a canary that moved, the stopping rule
# mid-cycle, and a run that could not be judged.
#
# The operator reads this file and never writes it. That is proved each cycle
# rather than trusted: see "the policy wall" in loop.py.
# --------------------------------------------------------------------------- #
[policy]
# What a cycle reports having been ruled by. The digest beside it is taken over
# the parsed table, so reflowing a comment moves nothing and changing a number
# moves it.
name = "northwind-weekly"

# Recorded on every decision whether or not a clause uses it: a decision that
# turns on the hour is reviewable only if the hour it turned on is written
# down. A clause that declares `during = "quiet_hours"` applies only inside it.
quiet_hours = { from = "22:00", to = "06:00", tz = "Europe/Rome" }

# The one case in this suite that wobbles on its own. Two cycles of it are
# absorbed; the third wakes somebody, because a dip that is still there a
# fortnight later has stopped being a dip.
#
# `because` is for whoever reads the diff, and nothing parses it. The clause is
# cited by `name` in every decision it rules.
[[policy.hold]]
name = "flaky-waterproof"
case = "is-it-waterproof"
assertion = "llm_rubric"
max_cycles = 2
because = "known to wobble on its own; a drift that outlasts two cycles is real"
