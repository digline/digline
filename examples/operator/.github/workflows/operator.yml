name: operator

# The loop. Inert while this lives inside the digline monorepo — GitHub runs
# only the workflows at a repository's own root — and live the day you fork
# this directory into one.
#
# `check.yml` beside it is the gate: every push, fails on a regression.
# This one is the operator: on a schedule, it decides what a red run *means*
# and wakes somebody only when the answer deserves a decision.

on:
  schedule:
    # Weekly, Monday 06:00 UTC. This is a demonstration, not a production
    # default: a real cadence is as often as you can afford, because every
    # cycle costs what the suite costs. Change it here **and** in
    # `operator.toml` — `loop.py` refuses to start when the two disagree.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      scenario:
        description: "steady | wobble | drift | structural (the demo's fake system)"
        default: steady
        type: string
      escalate:
        description: "open an issue, rather than only writing the alert"
        default: false
        type: boolean

# `issues: write` is what `gh issue create` needs, and `GITHUB_TOKEN` can only
# open an issue in the repository this workflow runs in. That is not a
# limitation here — it is DESIGN.md's "an issue in your own repository",
# enforced by the platform instead of by a policy.
permissions:
  contents: read
  issues: write
  # To fetch the previous cycle's decision journal (below).
  actions: read

# One cycle at a time. A second one started while the first is still running
# would read a journal the first has not written yet.
concurrency:
  group: operator
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      # ------------------------------------------------------------------ #
      # The journal. It is gitignored and a hosted runner starts empty, so
      # without this every cycle reads an empty journal and `max_cycles` can
      # never count past one — a clause holds forever, one cycle at a time.
      #
      # Carried as an artifact, not in the cache, which evicts entries unused
      # for seven days: exactly the cadence. Taken from the newest journal
      # uploaded rather than from the last green run, because a cycle that
      # decided and then failed to open an issue is a red run holding the
      # newest journal there is.
      #
      # Three outcomes, and only one of them is a streak of zero: no cycle has
      # ever uploaded a journal. One that exists and cannot be restored is an
      # **unknown** streak, and the seat is told so rather than handed an empty
      # file. The limit, stated: a journal past GitHub's retention is listed as
      # expired for a while and then deleted, and a silence longer than that
      # reads as a first cycle.
      # ------------------------------------------------------------------ #
      - name: Restore the decision journal
        id: journal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=decision-journal&per_page=100" \
            --jq '[.artifacts[]] | sort_by(.created_at) | last // empty | "\(.workflow_run.id) \(.expired)"')
          if [ -z "$newest" ]; then
            echo "no cycle has written a journal yet: starting it"
            echo "streak=first" >> "$GITHUB_OUTPUT"
          elif [ "${newest#* }" = "true" ] || ! gh run download "${newest%% *}" \
              --name decision-journal --dir .digline/northwind/decisions; then
            echo "::warning::the decision journal of run ${newest%% *} could not be restored: every clause's streak is unknown"
            echo "streak=unknown" >> "$GITHUB_OUTPUT"
          else
            echo "streak=restored" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------ #
      # Layers 1 and 2. No key, no model, no network beyond the target.
      # ------------------------------------------------------------------ #
      - name: Run the cycle
        id: cycle
        env:
          # The demo's fake system. Delete this line when you point the suite
          # at your own endpoint: there is no scenario in a real one.
          OPERATOR_SCENARIO: ${{ inputs.scenario || 'steady' }}
        run: |
          uv run python loop.py --config operator.toml --out cycle.json
          # Lifted out of the document so the escalation steps can branch on
          # them: a workflow `if:` cannot read a file.
          echo "wall=$(jq -r .probe.wall cycle.json)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # The seat. The classification above says what the measurement did;
      # this says whether it wakes anybody, under the policy declared in
      # `operator.toml`. Deterministic and key-free: a cycle and a policy in,
      # a decision out — which is what lets anyone holding both re-derive it.
      #
      # `escalate` is read from **here** and not from the cycle, and that is
      # the whole change: the classification proposes, the declared policy
      # decides, and the two are allowed to disagree in public.
      # ------------------------------------------------------------------ #
      - name: Decide
        id: decide
        env:
          # Through the environment, not interpolated into the script.
          STREAK: ${{ steps.journal.outputs.streak }}
        run: |
          unknown=""
          if [ "$STREAK" = "unknown" ]; then unknown="--streak-unknown"; fi
          uv run python decide.py --cycle cycle.json --config operator.toml \
            --out decision.json $unknown
          echo "escalate=$(jq -r .escalate decision.json)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # Layer 3. The only layer a model writes, and the only step that needs
      # a key. Skipped in full when the repository has not configured one —
      # and the alert then says so, rather than reading as though a judgment
      # had been made.
      # ------------------------------------------------------------------ #
      - name: The judgment layer
        id: judgment
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGLINE_LIVE: "1"
        run: |
          uv run python judgment.py --cycle cycle.json \
            --decision decision.json --out judgment.md

      - name: Build the alert
        run: |
          if [ -f judgment.md ]; then
            uv run python dossier.py --cycle cycle.json --decision decision.json \
              --judgment judgment.md --out alert.md
          else
            uv run python dossier.py --cycle cycle.json --decision decision.json \
              --out alert.md
          fi
          cat alert.md >> "$GITHUB_STEP_SUMMARY"

      # The alert always exists, whatever happens next. Delivery is
      # deliberately boring, and the job summary is the most boring delivery
      # there is: it needs no token and no permission.
      - uses: actions/upload-artifact@v4
        with:
          name: digline-operator-alert
          path: |
            alert.md
            cycle.json
            decision.json

      # What the next cycle restores. Uploaded whenever the seat wrote to it,
      # whatever happens after: a journal that lost its newest line is the
      # defect the restore step above exists to prevent.
      - uses: actions/upload-artifact@v4
        if: always() && steps.decide.outcome == 'success'
        with:
          name: decision-journal
          path: .digline/northwind/decisions/
          if-no-files-found: error

      # ------------------------------------------------------------------ #
      # Escalation. Off by default: a loop that opened an issue the day you
      # forked it would teach you to ignore it by the third week. Set the
      # repository variable OPERATOR_ESCALATE to `true`, or dispatch with
      # `escalate: true`, once you trust what it is telling you.
      # ------------------------------------------------------------------ #
      - name: Open an issue
        if: >-
          fromJSON(steps.decide.outputs.escalate || 'false') &&
          (vars.OPERATOR_ESCALATE == 'true' || inputs.escalate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "digline operator: $(jq -r .verdict cycle.json) on $(jq -r .suite cycle.json)" \
            --body-file alert.md \
            --label "$(jq -r '.escalation.labels | join(",")' cycle.json)"

      # ------------------------------------------------------------------ #
      # The wall. `loop.py` proved it before comparing: one write that must be
      # refused beside one that must succeed. Two outcomes wake somebody, and
      # they are two different issues because they are two different findings:
      # a collapse is the operator able to approve its own reference; an
      # inconclusive probe is the instrument down, and says nothing about the
      # wall either way. Same switch as above, so a fork's first week stays
      # quiet — the alert in the job summary says it regardless.
      # ------------------------------------------------------------------ #
      - name: The separation collapsed
        if: >-
          steps.cycle.outputs.wall == 'collapsed' &&
          (vars.OPERATOR_ESCALATE == 'true' || inputs.escalate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "digline operator: separation collapsed on $(jq -r .suite cycle.json) (high severity)" \
            --body-file alert.md \
            --label "$(jq -r '.escalation.labels | join(",")' cycle.json)"

      - name: The probe was inconclusive
        if: >-
          steps.cycle.outputs.wall == 'inconclusive' &&
          (vars.OPERATOR_ESCALATE == 'true' || inputs.escalate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "digline operator: the wall probe is down on $(jq -r .suite cycle.json) — the instrument, not the wall" \
            --body-file alert.md \
            --label "$(jq -r '.escalation.labels | join(",")' cycle.json)"
