name: check

# Inert while this lives inside the digline monorepo — the workflow that runs is
# the one at the repository root. It is here so that the day this directory
# becomes its own repository, the cycle is already wired.
#
# This is the *gate*: it runs on every push and fails if anything got worse.
# `operator.yml` beside it is the *loop*: it runs on a schedule and decides what
# a red run means. Two different jobs, and the second is not a replacement for
# the first — a gate that only ran weekly would let a regression ship on
# Tuesday.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      # From PyPI, like any user: this checks the published package, not a
      # checkout of it.
      - run: uv sync

      # `run` writes a run and prints its key; `compare` holds it against the
      # baseline committed in this repository and exits non-zero if anything got
      # worse. There is deliberately no `promote` here: promoting is the human
      # decision that *this* is the new normal, made by someone reading the
      # report and committing the result.
      - name: Compare with the committed baseline
        run: |
          KEY=$(uv run digline run --suite suite.py)
          uv run digline compare --suite suite.py --run "$KEY"

      - run: uv run ruff check .
      - run: uv run pyright
